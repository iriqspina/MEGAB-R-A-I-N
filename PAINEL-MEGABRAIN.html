<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel MEGABRAIN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --breu:#0B0C0E; --chapa:#15171B; --alto:#1D2026; --risco:#2A2E36;
  --osso:#E9E5DE; --meio:#9AA0AA; --sinal:#FFB000; --travado:#D0473E; --ok:#7FA88C;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--breu);color:var(--osso);font-family:var(--display);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased}
a{color:var(--sinal);text-decoration:none;border-bottom:1px solid rgba(255,176,0,.3)}
a:hover{border-bottom-color:var(--sinal)}
:focus-visible{outline:2px solid var(--sinal);outline-offset:2px}
button{font-family:inherit;color:inherit;cursor:pointer}

/* ---------- cabeçalho ---------- */
.topo{position:sticky;top:0;z-index:30;background:rgba(11,12,14,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--risco)}
.topo-linha{display:flex;gap:18px;align-items:center;padding:14px 20px;flex-wrap:wrap}
.marca{font-weight:800;letter-spacing:.16em;font-size:15px;text-transform:uppercase;white-space:nowrap}
.marca span{color:var(--sinal)}
.selo{font-family:var(--mono);font-size:11px;color:var(--meio);border:1px solid var(--risco);
  padding:3px 8px;border-radius:2px;white-space:nowrap}
.campos{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
.campo{display:flex;align-items:center;gap:7px;background:var(--chapa);border:1px solid var(--risco);
  border-radius:2px;padding:5px 10px}
.campo label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--meio);text-transform:uppercase}
.campo input{background:none;border:0;color:var(--osso);font-family:var(--mono);font-size:12px;width:210px;padding:2px 0}
.campo input:focus{outline:none}
@media(max-width:720px){.campo input{width:130px}}

/* ---------- trilha de gates ---------- */
.trilha-caixa{border-bottom:1px solid var(--risco);background:var(--breu)}
.trilha{display:flex;gap:0;padding:0 20px;overflow-x:auto;scrollbar-width:none}
.trilha::-webkit-scrollbar{display:none}
.pad{flex:1 0 auto;min-width:104px;background:none;border:0;border-right:1px solid var(--risco);
  padding:12px 14px 14px;text-align:left;position:relative;transition:background .12s}
.pad:first-child{border-left:1px solid var(--risco)}
.pad:hover{background:var(--alto)}
.pad .n{font-family:var(--mono);font-size:11px;color:var(--meio)}
.pad .rot{display:block;font-weight:600;font-size:13px;margin-top:2px;letter-spacing:-.01em}
.pad::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:transparent}
.pad[aria-selected="true"]{background:var(--alto)}
.pad[aria-selected="true"]::after{background:var(--sinal)}
.pad[data-feito="1"] .n{color:var(--sinal)}
.pad[data-feito="1"]::after{background:rgba(255,176,0,.35)}

.gate-detalhe{padding:16px 20px 20px;border-top:1px solid var(--risco);background:var(--chapa);display:none}
.gate-detalhe.aberto{display:block}
.gate-detalhe h3{margin:0 0 4px;font-size:17px;font-weight:800;letter-spacing:-.01em}
.gate-detalhe .sub{color:var(--meio);font-size:13px;margin-bottom:12px}
.gate-detalhe pre{background:var(--breu);border:1px solid var(--risco);border-radius:2px;padding:14px;
  font-family:var(--mono);font-size:12.5px;line-height:1.65;white-space:pre-wrap;margin:0 0 12px;max-height:280px;overflow:auto}

/* ---------- corpo ---------- */
.corpo{display:grid;grid-template-columns:250px 1fr;min-height:60vh}
@media(max-width:860px){.corpo{grid-template-columns:1fr}}
.indice{border-right:1px solid var(--risco);padding:18px 0 60px}
@media(max-width:860px){.indice{border-right:0;border-bottom:1px solid var(--risco);padding-bottom:18px}}
.grupo{margin-bottom:18px}
.grupo h4{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--meio);margin:0 0 6px;padding:0 20px}
.item{display:block;width:100%;text-align:left;background:none;border:0;border-left:2px solid transparent;
  padding:5px 20px;font-size:13.5px;color:var(--osso);opacity:.82}
.item:hover{opacity:1;background:var(--chapa)}
.item[aria-current="true"]{opacity:1;border-left-color:var(--sinal);background:var(--chapa);font-weight:600}
.item.oculto{display:none}

.leitor{padding:26px 34px 90px;min-width:0;max-width:none}
@media(max-width:860px){.leitor{padding:22px 18px 70px}}
.leitor-topo{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-bottom:12px;
  border-bottom:1px solid var(--risco);margin-bottom:22px}
.leitor-topo h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.015em}
.leitor-topo .meta{font-family:var(--mono);font-size:11px;color:var(--meio);margin-left:auto}

/* ---------- botões ---------- */
.btn{background:var(--alto);border:1px solid var(--risco);border-radius:2px;padding:6px 12px;
  font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;transition:.12s}
.btn:hover{border-color:var(--sinal);color:var(--sinal)}
.btn.feito{border-color:var(--ok);color:var(--ok)}
.btn-sinal{background:var(--sinal);color:#131313;border-color:var(--sinal);font-weight:600}
.btn-sinal:hover{background:#ffc23d;color:#131313}
.btn-linha{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- cartões de mecânica ---------- */
.cartao{border:1px solid var(--risco);border-radius:3px;background:var(--chapa);margin-bottom:16px;overflow:hidden}
.cartao h3{margin:0;padding:13px 16px 4px;font-size:15px;font-weight:700;letter-spacing:-.01em}
.cartao .sobre{padding:0 16px 12px;color:var(--meio);font-size:13px}
.cmd{display:flex;gap:12px;align-items:center;border-top:1px solid var(--risco);padding:9px 16px}
.cmd .rot{font-size:12.5px;color:var(--meio);min-width:190px}
.cmd code{font-family:var(--mono);font-size:12px;color:var(--osso);word-break:break-all;flex:1;min-width:0}
.cmd .btn{flex-shrink:0}
@media(max-width:720px){.cmd{flex-wrap:wrap;gap:7px}.cmd .rot{min-width:0;width:100%}}

/* ---------- tabela ---------- */
table{border-collapse:collapse;width:100%;margin:14px 0 26px;font-size:13px}
th,td{border-bottom:1px solid var(--risco);padding:7px 10px;text-align:left;vertical-align:top}
th{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--meio);font-weight:500}
td.mono,.mono{font-family:var(--mono);font-size:12px}

/* ---------- markdown ---------- */
.md h1{font-size:23px;font-weight:800;letter-spacing:-.02em;margin:30px 0 10px}
.md h2{font-size:18px;font-weight:700;margin:28px 0 8px;padding-top:14px;border-top:1px solid var(--risco)}
.md h3{font-size:15px;font-weight:700;margin:20px 0 6px}
.md h4{font-size:13px;font-weight:600;margin:16px 0 4px;color:var(--meio)}
.md p{margin:0 0 12px;max-width:74ch}
.md ul,.md ol{margin:0 0 12px;padding-left:20px;max-width:74ch}
.md li{margin-bottom:4px}
.md code{font-family:var(--mono);font-size:12.5px;background:var(--chapa);border:1px solid var(--risco);
  border-radius:2px;padding:1px 5px}
.md pre{background:var(--chapa);border:1px solid var(--risco);border-left:2px solid var(--sinal);
  border-radius:2px;padding:13px 15px;overflow-x:auto;margin:0 0 14px}
.md pre code{background:none;border:0;padding:0;font-size:12.5px;line-height:1.6}
.md blockquote{border-left:2px solid var(--sinal);margin:0 0 14px;padding:2px 0 2px 15px;color:var(--meio);max-width:74ch}
.md hr{border:0;border-top:1px solid var(--risco);margin:24px 0}
.md strong{font-weight:600;color:#fff}
.md table{max-width:100%}
.md .marca-busca{background:rgba(255,176,0,.28);color:#fff;border-radius:2px}

.aviso{font-size:12.5px;color:var(--meio);border-left:2px solid var(--risco);padding-left:12px;margin:18px 0}
.rodape{border-top:1px solid var(--risco);padding:16px 20px 40px;font-family:var(--mono);font-size:11px;color:var(--meio)}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);background:var(--sinal);
  color:#131313;font-family:var(--mono);font-size:12px;font-weight:600;padding:9px 16px;border-radius:2px;
  opacity:0;pointer-events:none;transition:.18s;z-index:60}
#toast.ver{opacity:1;transform:translateX(-50%) translateY(0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

1/A2: a deriva de versão\nnão é um evento isolado, é a falha default de qualquer cópia que não roda\nteste.\n\n**Fechado:** aresta removida; `dna/` regenerado e validado em v5.1.\n\n---\n\n## Média\n\n### M1 · Dois arquivos, mesmo hash, duas fontes futuras\n\n`SKILL.md` == `skills/megabrain/SKILL.md` (`7a06f777…`, idênticos).\n`MEGABRAIN.md` == `260810_MEGABRAIN.md` (`bfefcf72…`, idênticos).\n\nHoje é redundância. Na primeira edição em um só lado, é fork silencioso — o\nmesmo mecanismo do A1, agora dentro do próprio repo. Os scripts já elegeram um\nlado: `mb-check-version.py` e `mb-sync-projeto-para-central.py` mapeiam\n`skills/megabrain/SKILL.md`. O da raiz é a cópia sem dono.\n\n**Fechado:** cópias sem dono removidas.\n\n### M2 · Duas versões do mesmo script na mesma pasta\n\n`bin/mb-sync.py` (9.594 bytes) e `bin/260810_mb-sync.py` (5.389 bytes).\n\nO antigo não tem campo `USUARIO`, aceita `release` sem `--agente` e não tem\n`--force` protegido: libera trava alheia sem perguntar. Manter a versão insegura\nao lado, com nome quase igual, é esperar um autocomplete infeliz.\n\n**Fechado:** o antigo saiu do pacote.\n\n### M3 · `requirements.txt` promete dez dependências que ninguém importa\n\n`filelock`, `platformdirs`, `mistune`, `nh3`, `pydantic`, `structlog`,\n`watchdog`, `rich`, `pytest`, `ruff` — busca em `bin/`: **zero ocorrências**.\n\n```\ngrep -rl \"filelock\\|pydantic\\|structlog\\|watchdog\\|mistune\" bin/   # vazio\n```\n\n`pip install -r requirements.txt` baixa onze pacotes e não muda uma linha de\ncomportamento. É lista de intenções com nome de arquivo de build.\n\n**Fechado:** virou `docs/dependencias-sugeridas.txt`, com a nota de que o núcleo\nroda em stdlib pura.\n\n### M4 · Zero teste, num pacote que pedia `pytest`\n\n`mb-sync.py` é o componente que transforma disciplina em garantia. Não havia um\núnico teste provando que a trava trava, que `release` recusa trava alheia, ou\nque `status` devolve o código de saída certo.\n\nRegra de ouro 21 do `MEGABRAIN.md`: garantia real é script, não markdown. O\ncorolário que faltava: **script sem teste é markdown com extensão `.py`** — e o\nA5 é a prova, porque passou despercebido por quatro versões.\n\n**Fechado:** `tests/test_mb_sync.py`, 7 casos, roda sem dependência\n(`python tests/test_mb_sync.py`). Contra a v4.9, falha.\n\n### M5 · A vitrine estava quatro versões atrás\n\n`VERSAO.txt` dizia v4.9; `dna/dna.json` e `dna/RELATORIO-DNA.html` diziam v4.5,\ngerados em 2026-08-14, com a numeração errada do A2. O `dna/README.md` diz\n\"nunca editar na mão; rode o script de novo\" — e o script não foi rodado.\n\nArtefato gerado que não é regerado no Gate 6 é artefato que mente.\n\n**Fechado:** `dna/` e o painel são regerados no mesmo ciclo em que a versão sobe.\n\n---\n\n## Baixa\n\n### B1 · Raiz com 18 entradas e duas convenções de nome\n\nCinco `.cmd` com prefixo `260810_` e um sem. Prefixo de data faz sentido em\ndocumento que se acumula; em executável chamado pelo nome, é ruído — e a\nconvenção nem era seguida por todos. `LEIAME.md` existia só para dizer que o\nconteúdo está no `README.md`, justificando-se com *\"fica só por não poder ser\napagado depois de escrito\"*, o que não é verdade.\n\n**Fechado:** raiz com 7 entradas, `.cmd` todos em `scripts/`, sem prefixo.\n\n### B2 · `LEIAME.txt` estava na fonte, mas só faz sentido na cópia\n\nDizia \"NÃO EDITE os arquivos desta pasta / a fonte manda\". Correto dentro de\n`projeto/MEGABRAIN/`. Na raiz da fonte, instruía a não editar a própria fonte.\n\n**Fechado:** virou `modelos/LEIAME-copia-de-projeto.txt`, copiado pelo\n`novo-projeto.cmd` para dentro do projeto derivado.\n\n### B3 · O README descrevia `bin/` melhor que o `SKILL.md`\n\nQuem lê o protocolo pelo agente nunca descobria que existe `mb-aspirador.py`,\n`mb-relatorio-projeto.py` ou `mb-backup-central.py`. A seção 9 falava em\n\"script em `bin/`\" de forma genérica. As ferramentas existem e são boas —\nfaltava a linha que as convoca.\n\n**Fechado:** o painel lista toda mecânica com o comando pronto para copiar, já\ncom o caminho da instalação do usuário.\n\n---\n\n## O que não vou reclamar\n\nO núcleo está certo, e isso é raro. Gates que exigem reescrita em vez de\nanúncio. `DECISOES.md` append-only guardando a alternativa descartada, que é o\núnico conteúdo do arquivo que envelhece bem. Contexto tratado como orçamento\ncompartilhado entre agentes. Reparo limitado a uma rodada, com a explicação\ncerta: loop de autocrítica converge para média homogênea. O léxico anti-slop é\nespecífico o bastante para ser executável — a maioria dos guias desse tipo para\nem \"evite jargão\".\n\nOs treze achados são de manutenção e empacotamento, não de tese. É a diferença\nentre um protocolo errado e um protocolo certo que envelheceu quatro versões em\nduas semanas — sem teste que avisasse.\n\n## A crítica que sobra depois de tudo corrigido\n\n**O protocolo não tem gate para si mesmo.** Ele manda auditar entrega,\nverificar caminho, registrar decisão — e nada disso apontava para o próprio\npacote. O A5 sobreviveu quatro versões porque ninguém rodou `mb-sync.py` num\nprojeto de verdade depois de mexer nele.\n\nA correção estrutural não é uma regra a mais no `SKILL.md`. É o que a v5.1 faz\nagora: `tests/` roda em segundos, `mb-arrumar.py --verificar` procura referência\nquebrada, e o painel mostra o hash da cópia instalada ao lado do hash do repo.\nTrês garantias de script contra a única classe de erro que o protocolo, por\nconstrução, não conseguia enxergar sozinho.\n", "bytes": 11251, "sha": "0208379faff8b12f", "mtime": "2026-08-16 09:52"}, {"caminho": "MEGABRAIN.md", "nome": "MEGABRAIN.md", "texto": "# MEGABRAIN v3 · pipeline local completa (com camada pessoal)\n\n**TL;DR:** este arquivo é o canônico local — substitui `PIPELINE.md` como\ndocumento-mestre. Junta a camada macro (fases de projeto, artefatos, regras\nde ouro, níveis de adoção — herdadas do `PIPELINE.md` v2) com a camada micro\nmulti-agente (gates de entrega, Claude+Kimi, roteamento) que agora vive em\n`skills/megabrain/SKILL.md`. A versão que sobe pro GitHub é\n`260810_github-export/` — igual na estrutura, sem nada pessoal.\n\nVersão: ver `VERSAO.txt`. Lições vivas: `licoes-megabrain.md`.\nReferências de execução: `referencias/260810_*.md`.\n\n---\n\n## 1 · Relação entre os três arquivos\n\n| Arquivo | Escopo | Editar aqui? |\n|---|---|---|\n| `skills/megabrain/SKILL.md` | Router do `/megabrain` — gates de entrega, multi-agente (Claude+Kimi), roteamento de arquitetura | Sim — é o que dispara |\n| `MEGABRAIN.md` (este) | Camada de projeto: fases macro, artefatos, regras de ouro, níveis de adoção, biblioteca visual pessoal | Sim |\n| `260810_memoria-pessoal.md` | Perfil de identidade (nome, TDAH, formato de resposta obrigatório) — fonte da sincronização entre agentes, nunca sai desta pasta | Sim |\n| `PIPELINE.md` | v2, congelado — mantido por histórico, não recebe mudança nova | Não |\n\n`PIPELINE.md` continua no disco (não apago nem renomeio arquivo já escrito)\ncom um aviso de descontinuação no topo apontando pra cá.\n\n---\n\n## 1b · Migração v4.0: diferenciação de usuário\n\nDesde a v4.0 o megabrain carrega um campo `USUARIO:` em dois lugares:\n\n1. No `HANDOFF.md` de cada projeto — a trava de handoff agora registra para\n   qual pessoa o agente está trabalhando.\n2. Nos arquivos de identidade sincronizados — `CLAUDE.md`, `GEMINI.md` e\n   `AGENTS.md` passam a declarar o perfil logo no início.\n\n### Por que isso importa\n\nAntes da v4.0 o protocolo assumia implicitamente um único operador. Se outra\npessoa usar o pacote (fork, clone ou máquina compartilhada), o `HANDOFF.md`\nnão dizia para quem a trava estava ativa e os agentes não sabiam qual perfil\ncarregar. A v4.0 torna isso explícito sem quebrar projetos antigos.\n\n### O que acontece quando um projeto derivado sincroniza automaticamente\n\nQuando `mb-check-version.py` copia a central para dentro do `MEGABRAIN/` do\nprojeto, os scripts novos passam a:\n\n- Detectar `USUARIO:` do arquivo de identidade do projeto\n  (`260810_memoria-pessoal.md` na raiz do projeto ou da central).\n- Gravar `USUARIO:` no `HANDOFF.md` toda vez que alguém rodar\n  `mb-sync.py lock`.\n- Injetar `USUARIO:` nos arquivos de identidade quando alguém rodar\n  `mb-sync-memoria.py`.\n\nProjetos antigos continuam funcionando: se não houver arquivo de identidade,\no campo aparece como `<USUARIO>` e o script indica que é preciso configurar.\n\n### Como configurar no seu projeto derivado (ou depois de um fork/clone)\n\n1. Crie um arquivo de identidade na raiz do seu projeto ou da central com o\n   nome `260810_memoria-pessoal.md`.\n2. No início dele, coloque:\n   ```\n   USUARIO: Seu Nome\n   ```\n3. Rode a sincronização de identidade:\n   ```\n   python MEGABRAIN/bin/mb-sync-memoria.py --source 260810_memoria-pessoal.md --target all --dir .\n   ```\n4. A partir daí, toda trava de handoff vai registrar o nome automaticamente:\n   ```\n   python MEGABRAIN/bin/mb-sync.py lock --agente Kimi --escopo pasta/arquivo\n   ```\n\n### Como trocar de perfil ou adicionar outro usuário\n\n- Para forçar um nome só na trava atual: use `--usuario` no `mb-sync.py` ou\n  `mb-sync-memoria.py`.\n- Para mudar o padrão do projeto: edite `USUARIO:` no\n  `260810_memoria-pessoal.md` e rode `mb-sync-memoria.py` de novo.\n- Para múltiplos perfis no mesmo computador: mantenha arquivos de identidade\n  separados (ex.: `260810_memoria-pessoal-fulano.md`) e passe `--source` e\n  `--usuario` explicitamente.\n\n### Uso offline e recuperação\n\nA pasta `MEGABRAIN/` dentro de cada projeto é uma cópia local completa do\nprotocolo. Se o GitHub ou a internet caírem, os scripts continuam\nfuncionando direto de lá. Para sincronizar sem consultar a rede:\n\n```\npython MEGABRAIN/bin/mb-check-version.py --projeto \"caminho/do/projeto\" --offline\n```\n\nPara não depender só do GitHub, faça backup da central:\n\n```\ncd <pasta-central>\npython bin/mb-backup-central.py\n```\n\nSe a pasta `MEGABRAIN/` de um projeto sumir, recupere de um backup zip,\nde outro projeto ou da central:\n\n```\npython MEGABRAIN/bin/mb-recuperar-megabrain.py --projeto \"caminho/do/projeto\" --fonte \"backup.zip\"\n```\n\nMais detalhes: `MEGABRAIN/OFFLINE.md`.\n\n---\n\n## 2 · Fases do projeto (macro — herdado do PIPELINE.md v2)\n\n```\nestado → grelhar → spec → tickets → implementar → validar → publicar → registrar\n```\n\n1. **ESTADO** — medir antes de dizer. Toda sessão começa lendo o estado real\n   (git, build, testes, o que está no ar) e devolve um retrato de 5 linhas,\n   TL;DR primeiro. Sinal que não se mediu vira `?`, nunca chute.\n2. **GRELHAR** — entender antes de especificar. Interrogatório até fechar\n   cada ramo. O que se aprende vira termo no `CONTEXT.md` ou decisão\n   registrada — nunca fica só na conversa.\n3. **SPEC** — uma por feature, viva, em `.scratch/<feature>/spec.md`, com\n   critérios de aceite verificáveis. Sonda de 2 minutos antes: suposição de\n   viabilidade vira linha SIM/NÃO medida antes de entrar na spec.\n4. **TICKETS** — decomposição com dependência (`Blocked by`, prioridade,\n   critério de aceite próprio).\n5. **IMPLEMENTAR** — um ticket por vez, TDD por fatia. Revisão em dois eixos\n   (padrão do repo + fidelidade à spec) antes do commit. Nunca código sem\n   spec.\n6. **VALIDAR** — o número sai do harness, nunca de documento. Teste que\n   afirmava o bug e não afirma mais: reaponta se mudou de lugar, apaga se o\n   defeito sumiu — nunca remenda pra defender o erro.\n7. **PUBLICAR** — portões impossíveis de pular, pausa antes do irreversível.\n   Build → verificar artefato → auditoria → harness → **pausa** → deploy →\n   smoke → linha no CHANGELOG. O agente prepara e testa, nunca executa\n   deploy ou migração: entrega `.cmd` pronto que roda os portões e pausa.\n8. **REGISTRAR** — sessão sem rastro não aconteceu. Diário ganha entrada;\n   lição nova entra no arquivo de lições (GATILHO/LIÇÃO/ATALHO) sem pedir\n   permissão. Lição 3× vira regra deste arquivo ou de uma skill.\n\n## 3 · Artefatos (o que existe em todo projeto adulto)\n\n| Artefato | Papel |\n|---|---|\n| `CONTEXT.md` | glossário do domínio |\n| regras do repo (`CLAUDE.md` ou equivalente) | regras fixas do projeto |\n| `.scratch/<feature>/` | tracker vivo: spec, plano, grelha, issues |\n| `docs/` | planos e handoffs, `YYMMDD` quando datado |\n| `Atalhos\\*.cmd` + `LEIAME` | dia a dia num clique, numerados |\n| relatório de projeto (`RELATORIO.html`) | instância aplicada — contexto, estado/handoff, situação e pendências concentrados num HTML só; gerado por `bin/mb-relatorio-projeto.py` (ver seção 5b) — edita-se o gerador/fonte, nunca o HTML |\n| `CHANGELOG.md` | o que subiu, mais novo primeiro |\n| `_arquivo\\_tmp\\` | sondas e scripts de uma vez só |\n| `MEGABRAIN\\` | esta pipeline sincronizada (inclui `dna\\` — relatório DNA do protocolo) — não editar a cópia |\n\n## 4 · Regras de ouro (valem em todo projeto)\n\n1. Nunca escrever código sem plano ou spec. Sem exceção.\n2. Um comando de terminal por vez — prompt interativo engole a linha colada.\n3. `YYMMDD` só fora do repo (exports, entregas). Dentro, nome estável.\n4. Gerado nunca se edita — edita-se a fonte/o gerador.\n5. Arquivo gigante se lê por trecho (Grep/offset), nunca inteiro sem necessidade.\n6. Deploy, migração, irreversível: sempre `.cmd` pronto com pausa — nunca lista\n   de comandos no chat.\n7. Ao pedir ação, sempre o caminho completo da pasta/arquivo.\n8. Local-first — dado pessoal não sobe pra serviço externo.\n9. Medir > supor. `?` em vez de chute; hash e byte em vez de \"deve estar igual\".\n10. Tela muda não se distingue de travada — tarefa longa nunca redireciona a\n    saída inteira pra arquivo; dois relatores (tela + log) ou Tee.\n11. Achado é endereço, não posição — nunca renumerar; derrubado fica riscado\n    com o porquê; novo pega o próximo número livre.\n12. Commit alheio pendente não sequestra arquivo novo — checar `git status`\n    antes de versionar; havendo pendência, `git add <lista explícita>`.\n13. Buscar comportamento por verbos e sinônimos, não pelo termo do enunciado.\n14. Teste vermelho pós-conserto: reapontar ou apagar — nunca remendar seletor\n    que defende erro.\n15. Feedback de ação nasce no campo visual de quem clicou.\n16. Navegador não executa `.cmd` por link — copiar caminho + Win+R, ou clique\n    direto na pasta.\n17. Formato de resposta padrão: TL;DR no topo; primeira frase de cada parte\n    resume a parte; tópicos numerados.\n18. Portar entre agentes/runtimes: hooks não atravessam, skills atravessam\n    sem edição. Sempre-ativo e estático vai pro system prompt, não pro hook.\n19. Memória/arquivo legado: normalizar pra UTF-8 puro antes de editar por\n    programa.\n20. Quadro que se monitora vira widget pinado + tarefa agendada.\n21. **Garantia real é script, não markdown.** O que precisa acontecer sempre\n    e sem falha vive em `.cmd`/script/hook, nunca só numa skill.\n22. Formato pedido explicitamente vence o protocolo. Ordem: formato pedido >\n    protocolo > default.\n\n## 5 · Camada micro (gates de entrega + multi-agente)\n\nVive em `skills/megabrain/SKILL.md` — router completo: gates\nassumir/enquadrar/orçar/gerar/auditar/reparar/verificar/bastão/aprender,\ndivisão Claude↔Kimi, roteamento de arquitetura (skill vs subagente vs hook\nvs script), Duplo Diamante pra projeto de design. Não duplicado aqui —\nedite lá.\n\n## 5b · Relatório de projeto — template de consolidação\n\nDesde 260814. Todo projeto pode gerar um **relatório de projeto**: o irmão\ndo relatório DNA (`MEGABRAIN\\dna\\`). O DNA descreve o **protocolo**\n(genérico, estável); o relatório de projeto descreve a **instância** — um\núnico HTML, direcionado a usuário E IA, que concentra o que antes exigia\nabrir vários `.md` soltos:\n\n- **contexto específico** (`CONTEXT.md` do projeto) + **contexto geral**\n  (resumo do `MEGABRAIN.md` central, quando acessível);\n- **estado e handoff** — lê `ESTADO.md`/`HANDOFF.md`/`DECISOES.md` do\n  projeto **como referência, sem mover os arquivos**; projeto nível 1-2 sem\n  esses três arquivos usa o próprio arquivo vivo (`--plano`) como fonte de\n  estado + decisões, e o relatório diz isso explicitamente em vez de fingir\n  seção vazia;\n- **situação viva** — o arquivo indicado em `--plano` (ex.: `PLANO.md`,\n  `ESTADO.md`), renderizado por inteiro;\n- **arquivos extra de domínio** — `--extra` (repetível): cada um vira sua\n  própria seção;\n- **ação imediata** (desde 260814) — card em destaque logo abaixo do TL;DR,\n  visualmente separado (fundo escuro, checklist numerado grande) — extrai UM\n  heading do `--plano` (palavra-chave \"ação imediata\"/\"o que fazer agora\"/\n  \"faça isto\"...) e mostra como sequência óbvia \"faça isto, depois isto\".\n  Diferente de \"resolução\" (que pode ter várias alternativas concorrentes)\n  — aqui é o caminho único recomendado. `--sem-acao-imediata` desliga;\n  `--acao-imediata-titulo PALAVRA` adiciona palavra-chave própria;\n- **ações rápidas** (desde 260814) — `--acao \"Rótulo|URL\"` (repetível)\n  coloca botões no card de ação para abrir uma URL HTTPS ou pular para uma\n  âncora do próprio relatório. O gerador recusa `javascript:`, `file:` e\n  outros esquemas; botão serve para ação que o usuário realmente precisa\n  executar, não para abrir scripts locais;\n- **resolução — alternativas pra resolver a situação** (desde 260814; nome\n  antigo era \"caminhos\", trocado porque ficava ambíguo com caminho de\n  arquivo) — varre `--plano` + `--extra` por headings `##`/`###` cujo texto\n  bate com palavras-chave (`plano de ação`, `estratégia`, `alternativas`,\n  `resolução`, `o que fazer`...) e destaca esses trechos numa seção própria,\n  em cima da \"situação viva\" — sem duplicar o arquivo fonte, só recorta o\n  que já existe. `--sem-resolucao` desliga; `--resolucao-titulo PALAVRA`\n  (repetível) adiciona palavra-chave própria do domínio;\n- **próximas ações** — lidas do `SKILL.md` router do projeto, se passado em\n  `--skill`;\n- **dados pendentes** — toda linha `- [ ]` / `- [x]` de qualquer arquivo\n  lido entra automaticamente numa lista única \"Dados pendentes\", com a\n  fonte de cada item — não precisa marcar pendência duas vezes;\n- **fontes** (antes \"caminhos\") — tabela com o caminho absoluto de cada\n  arquivo lido, com botão de copiar; é só a lista de arquivo/pasta, não\n  confundir com a seção \"resolução\" acima.\n\nGerador: `bin/mb-relatorio-projeto.py --projeto PATH --titulo NOME --plano\nARQUIVO [--extra ARQUIVO]... [--skill ARQUIVO] [--tldr \"frase\"]\n[--megabrain-central PATH] [--sem-resolucao] [--resolucao-titulo PALAVRA]...\n[--sem-acao-imediata] [--acao-imediata-titulo PALAVRA] [--acao \"Rótulo|URL\"]...`. `--saida`\ndefault é `RELATORIO.html` na raiz do projeto. Referência de uso completo\n(todos os argumentos preenchidos):\n`Financeiro da Silva/05_scripts/gerar_relatorio.py`.\n\nConversor markdown→HTML (`markdown_para_html`) junta linhas indentadas de\ncontinuação dentro de um item de lista (`- texto` ou `N. texto` que quebra em\nmais de uma linha por largura) — sem isso, cada linha de continuação virava\nparágrafo solto fora da lista. Também nunca casa o `#` (H1, título do\ndocumento) ao procurar heading de \"resolução\"/\"ação imediata\" — só `##`/`###`/\n`####` — pra não confundir o título do arquivo com uma seção de conteúdo (já\naconteceu: um H1 com a frase \"ação imediata\" no meio do texto virou match\nfalso e engoliu o arquivo inteiro pra dentro do card).\n\nRegra de ouro 4 vale igual aqui: **gerado nunca se edita**. O HTML de saída\nnão se toca na mão — edita-se o(s) `.md` fonte e roda-se o gerador de novo.\n\nNão confundir com o relatório DNA nem tentar fundir os dois num arquivo só:\no DNA precisa ficar estável e genérico (é o que se copia pra replicar o\nprotocolo em outro lugar); o relatório de projeto carrega o que é\nespecífico daquele projeto e poluiria o template se misturado.\n\n## 6 · Biblioteca visual pessoal (âncoras concretas)\n\nMetodologia genérica — como montar e usar qualquer biblioteca de referência —\nestá em `referencias/260810_galerias-referencia.md` (essa parte foi pro\nGitHub, é método, não gosto pessoal). Aqui fica só a lista concreta:\n\n- **Motion/web:** osmo.supply (execução: componentes, easings) ·\n  tympanus.net/codrops (técnica com código aberto) · land-book.com (volume) ·\n  siteinspire.com (curadoria seca) · lapa.ninja (seções isoladas) ·\n  onepagelove.com (one-pagers) · awwwards.com (teto de ambição — enviesa pra\n  espetáculo) · recent.design (mais multidisciplinar, gráfico + digital) ·\n  refero.design (screenshots de UI real — a melhor pra Operate/Read) ·\n  navbar.gallery · footer.design\n- **UI/game UI:** gameuidatabase.com (HUD, menu, inventário) ·\n  interfaceingame.com (por jogo e elemento) · artstation.com (material e\n  atmosfera, não layout)\n\n## 7 · Níveis de adoção por projeto\n\n| Nível | O que o projeto tem | Quando |\n|---|---|---|\n| **1 · referência** | `MEGABRAIN\\` + `CONTEXT.md` | projeto novo ou exploração |\n| **2 · tracker** | + `.scratch/` com specs/tickets + regras do repo | entrou em desenvolvimento |\n| **3 · ciclo completo** | + harness com carimbo + `Atalhos\\` + relatório vivo + deploy com portões | produto no ar |\n\nTodo projeto nasce no nível 1 (`novo-projeto.cmd`). Subir de nível é decisão\nexplícita, com spec — nunca por acidente.\n\n## 8 · Roteamento de projetos pessoais → skill dedicada\n\n(Seção removida no template público: os projetos pessoais do usuário são substituídos por exemplos genéricos.)\n\n## 9 · Como esta pipeline evolui\n\n1. Lição nova → arquivo de lições (GATILHO/LIÇÃO/ATALHO, data `YYMMDD`).\n2. Lição reutilizável → versão sanitizada na fonte central; se o usuário\n   declarou promoção obrigatória, isso acontece no mesmo ciclo.\n3. Lição 3× → entra neste arquivo, na `SKILL.md`, num template ou script.\n4. Editou a fonte → bump em `VERSAO.txt` (data + uma linha do que mudou).\n5. Espalhar → `sincronizar-pipeline.cmd`.\n6. A cópia dentro de cada projeto não se edita — a fonte manda.\n\n## 10 · Versão multi-IA (opcional)\n\nPara projetos que usam mais de um agente, o guia de escolha de modelo está em\n`referencias/260813_multi-ia.md`. Ele é opcional: lido junto com este arquivo\nquando o projeto é multi-agente, ou ignorado quando o projeto usa um só\nagente. Se a leitura conjunta falhar ou pesar o contexto, use a referência\nseparada como fallback.\n\nOrigem: fusão entre pipeline de projeto v2 e protocolo multi-agente v3.\n", "bytes": 17020, "sha": "52cbf10f3340128a", "mtime": "2026-08-16 04:57"}, {"caminho": "OFFLINE.md", "nome": "OFFLINE.md", "texto": "# Usar o megabrain offline\n\nA pasta `MEGABRAIN/` dentro de um projeto é uma **cópia local completa** do\nprotocolo. Ela funciona sozinha — não depende de internet, GitHub nem de\nqualquer repositório remoto.\n\n## Quando usar este modo\n\n- Você está sem internet.\n- O GitHub está fora do ar.\n- Você não quer/pode clonar o repositório público.\n- Você copiou o projeto de outra máquina e só quer continuar trabalhando.\n\n## O que funciona offline\n\nTodos os scripts dentro de `MEGABRAIN/bin/` rodam localmente:\n\n- `mb-sync.py` — trava/libera o `HANDOFF.md` do projeto.\n- `mb-sync-memoria.py` — sincroniza seu perfil de identidade para\n  `CLAUDE.md`/`GEMINI.md`/`AGENTS.md`.\n- `mb-aspirador.py` — limpa e revisa código local.\n- `mb-relatorio-projeto.py` — gera o relatório de projeto.\n- `mb-relatorio-dna.py` — gera o relatório DNA do protocolo.\n\nAs referências em `MEGABRAIN/referencias/` e o DNA em `MEGABRAIN/dna/` também\nestão disponíveis localmente.\n\n## O que NÃO funciona offline\n\n- `mb-check-version.py --verificar-git` — precisa consultar o remote.\n- Atualizações automáticas vindo do repositório público.\n\nNesses casos o script avisa e continua usando a cópia local.\n\n## Como atualizar quando a internet voltar\n\n1. Se você tem a central do megabrain no disco:\n   ```\n   python MEGABRAIN/bin/mb-check-version.py --projeto \"caminho/do/projeto\"\n   ```\n2. Se a central também veio do git e está desatualizada:\n   ```\n   cd <pasta-da-central>\n   git pull origin main\n   python bin/mb-check-version.py --projeto \"caminho/do/projeto\"\n   ```\n3. Se você só tem o projeto (sem central separada), copie a pasta\n   `MEGABRAIN/` de um projeto atualizado por cima da sua.\n\n## Backup da central\n\nPara não depender só do GitHub, faça backups periódicos da pasta central:\n\n```\ncd <pasta-central-do-megabrain>\npython bin/mb-backup-central.py\n```\n\nO backup vai para `.mb-backup/central-YYYYMMDD-HHMMSS.zip`. Guarde esse\nzip em outro lugar (HD externo, nuvem, outra máquina).\n\n## Recuperar um projeto se a central sumir\n\nSe a pasta `MEGABRAIN/` do projeto foi apagada/corrompida, recrie a partir\nde outra fonte:\n\n```\n# De um backup zip:\npython MEGABRAIN/bin/mb-recuperar-megabrain.py \\\n  --projeto \"caminho/do/projeto\" \\\n  --fonte \"caminho/do/backup.zip\"\n\n# De outro projeto que ainda tenha MEGABRAIN/:\npython MEGABRAIN/bin/mb-recuperar-megabrain.py \\\n  --projeto \"caminho/do/projeto\" \\\n  --fonte \"outro/projeto/MEGABRAIN\"\n\n# Sem --fonte, ele tenta achar sozinho (central, outro projeto na mesma\n# pasta, ou backup mais recente):\npython MEGABRAIN/bin/mb-recuperar-megabrain.py \\\n  --projeto \"caminho/do/projeto\"\n```\n\n## Dica: mantenha o `MEGABRAIN/` do projeto atualizado\n\nSempre que tiver internet, rode o `mb-check-version.py` nos seus projetos.\nAssim a cópia local fica fresca e você não fica dependendo do remoto na\nhora do trabalho.\n", "bytes": 2872, "sha": "042a6a499b717a73", "mtime": "2026-08-16 04:57"}, {"caminho": "README.md", "nome": "README.md", "texto": "# MEGABRAIN\n\nProtocolo de execução para agentes de IA (Claude Code, Kimi CLI, Gemini CLI\ncomo fallback opcional, ou colado direto em qualquer chat) — pensado para\ndois ou mais agentes trabalhando no mesmo projeto sem pisar um no outro, e\npara impedir que entregas de IA saiam genéricas.\n\n## O que tem aqui\n\n- `skills/megabrain/SKILL.md` — o protocolo: gates de entrega (enquadrar → gerar → auditar →\n  verificar → passar o bastão → aprender), o gate de assumir trabalho\n  multi-agente, Duplo Diamante para projetos de design, roteamento de\n  arquitetura.\n- `MEGABRAIN.md` — a camada de projeto: fases macro (estado → spec →\n  implementar → publicar), artefatos, regras de ouro, níveis de adoção.\n- `referencias/` — a camada de execução, carregada sob demanda: anti-slop\n  (léxico e estrutura banidos com teste), metaprompts (padrões e templates\n  colecionáveis), engenharia de contexto, avaliação/rubricas, Duplo\n  Diamante completo, roteamento quando o design vira código, sincronização\n  de identidade entre agentes, governança comercial, Amarrador de Pontas,\n  Contraditor, teammates econômicos e um prompt portátil pra colar em\n  qualquer IA sem instalar nada.\n- `bin/` — scripts testados do protocolo:\n  - `mb-sync.py` — trava de handoff multi-agente em `HANDOFF.md`.\n  - `mb-sync-memoria.py` — sincroniza um arquivo de identidade local para\n    `CLAUDE.md`/`GEMINI.md`/`AGENTS.md`, idempotente.\n  - `mb-check-version.py` — compara a versão do megabrain de um projeto com\n    a central e sincroniza quando necessário.\n  - `mb-generate-template.py` — gera o pacote público sanitizado\n    (`260810_github-export/`).\n  - `mb-aspirador.py` — limpeza mecânica e não destrutiva de código\n    (dry-run por padrão, backup obrigatório).\n  - `mb-relatorio-dna.py` — gera o relatório DNA do protocolo em `dna/`.\n  - `mb-relatorio-projeto.py` — gera o relatório de instância de um\n    projeto específico (`RELATORIO.html`), com materiais consolidados e\n    botões de ação HTTPS/âncora passados por `--acao \"Rótulo|URL\"`.\n  - `mb-sync-projeto-para-central.py` — sobe alterações de um projeto para\n    a central do megabrain quando o projeto ficou mais novo.\n\n## Como usar\n\n1. Instale como skill no seu agente apontando pra este diretório. No Codex,\n   use `skills/codex-megabrain/`; nos agentes que consomem o protocolo\n   agnóstico, use `skills/megabrain/`. **Ou:**\n2. Cole `referencias/260810_PROMPT-PORTATIL.md` no início de uma conversa\n   com qualquer IA — não depende de arquivo nem de plataforma.\n\n## Como adaptar pro seu projeto\n\nOs 4 arquivos de estado multi-agente (`ESTADO.md`, `HANDOFF.md`,\n`DECISOES.md`, `LICOES.md`) não vêm prontos aqui — são criados por projeto,\nna raiz dele. `SKILL.md` gate 0 e gate 6 descrevem o formato.\n\nO arquivo de identidade que `mb-sync-memoria.py` sincroniza (seu perfil,\npreferências, formato de resposta) também não vem aqui — é pessoal, fica\nno seu computador ou num repo privado, nunca neste pacote público. Ver\n`referencias/260810_sync-memoria.md` para o protocolo.\n\nO gerador público também exclui `ESTADO.md`, `HANDOFF.md`, `DECISOES.md` e\n`RELATORIO.html` da central. Esses arquivos descrevem a operação privada e\ndevem ser criados por cada projeto, não distribuídos como parte do protocolo.\n\n## Migração v4.0 — diferenciação de usuário\n\nA v4.0 introduziu o campo `USUARIO:` no `HANDOFF.md` e nos arquivos de\nidentidade (`CLAUDE.md`/`GEMINI.md`/`AGENTS.md`). Se você forkou/clonou o\nrepositório ou sincronizou um projeto derivado, configure seu perfil:\n\n1. Crie `260810_memoria-pessoal.md` na raiz do projeto/central.\n2. Adicione `USUARIO: Seu Nome` no início.\n3. Rode:\n   ```\n   python MEGABRAIN/bin/mb-sync-memoria.py --source 260810_memoria-pessoal.md --target all --dir .\n   ```\n4. Use `python MEGABRAIN/bin/mb-sync.py lock --agente Kimi --escopo ...` —\n   o `HANDOFF.md` vai registrar seu nome automaticamente.\n\nDetalhes completos: `MEGABRAIN.md` seção 1b ou\n`referencias/260810_sync-memoria.md`.\n\n## Uso offline\n\nA pasta `MEGABRAIN/` dentro de cada projeto é uma cópia local completa do\nprotocolo. Se o GitHub ou a internet caírem, os scripts continuam\nfuncionando. Use:\n\n```\npython MEGABRAIN/bin/mb-check-version.py --projeto \"caminho/do/projeto\" --offline\n```\n\nPara backup da central:\n\n```\ncd <pasta-central>\npython bin/mb-backup-central.py\n```\n\nPara recuperar um projeto:\n\n```\npython MEGABRAIN/bin/mb-recuperar-megabrain.py --projeto \"caminho/do/projeto\" --fonte \"backup.zip\"\n```\n\nMais detalhes: `MEGABRAIN/OFFLINE.md`.\n", "bytes": 4594, "sha": "2fbac26ec097f109", "mtime": "2026-08-16 04:57"}, {"caminho": "VERSAO.txt", "nome": "VERSAO.txt", "texto": "2026-08-16 · v5.1 — trava de handoff consertada (aceita projeto fora da\npasta atual), suite de testes, .cmd sem placeholder, auditoria no pacote.\n\nHistorico completo: ver repositorio privado da pasta central.\n", "bytes": 212, "sha": "6297e3ee5a8c45a2", "mtime": "2026-08-16 05:00"}, {"caminho": "dna/README.md", "nome": "README.md", "texto": "# dna/\n\n`RELATORIO-DNA.html` — relatório DNA do megabrain (protocolo, genérico). `dna.json` — os mesmos dados em JSON puro. `.dna-backup/` — versões anteriores.\n\nGerado por `bin/mb-relatorio-dna.py` — nunca editar os arquivos desta pasta na mão; edite a fonte (`MEGABRAIN.md`, `SKILL.md`) e rode o script de novo.\n\nProcurando o relatório de UM projeto (não o protocolo)? É outro artefato: `RELATORIO.html` na raiz do projeto, gerado por `bin/mb-relatorio-projeto.py`.\n", "bytes": 483, "sha": "7dcd7a04178c722c", "mtime": "2026-08-16 09:52"}, {"caminho": "docs/dependencias-sugeridas.txt", "nome": "dependencias-sugeridas.txt", "texto": "DEPENDENCIAS SUGERIDAS (nao obrigatorias)\n=========================================\n\nNenhum script de bin/ importa qualquer uma destas bibliotecas. O nucleo\nroda em stdlib pura e continua rodando sem instalar nada. A lista abaixo\ne um roteiro de evolucao, nao um requisito de execucao - por isso deixou\nde se chamar requirements.txt.\n\n# requirements.txt — dependências recomendadas para o ecossistema MEGABRAIN.\n#\n# O núcleo (scripts em bin/) continua funcionando só com a stdlib;\n# estas bibliotecas são sugeridas para projetos que queiram adotar\n# padrões mais robustos de CLI, parsing, segurança e observabilidade.\n\n# 1. file locking cross-platform (alternativa robusta à trava leve de lockfile).\nfilelock>=3.15\n\n# 2. Diretórios padrão do sistema (config, cache, dados) de forma portátil.\nplatformdirs>=4.2\n\n# 3. Parsing de Markdown rápido e compatível (substitui parser artesanal).\nmistune>=3.0\n\n# 4. Sanitização de HTML segura (previne XSS em relatórios gerados).\nnh3>=2.4\n\n# 5. Validação de dados/configurações e serialização segura.\npydantic>=2.7\npydantic-settings>=2.3\n\n# 6. Logging estruturado (facilita debug e auditoria de execução).\nstructlog>=24.1\n\n# 7. Monitoramento de mudanças no filesystem (propagação automática de estado).\nwatchdog>=4.0\n\n# 8. Interface de terminal rica (relatórios, progresso, menus).\nrich>=13.7\n\n# 9. Testes automatizados para os scripts do megabrain.\npytest>=8.2\n\n# 10. Linter/formatador ultra-rápido (qualidade de código).\nruff>=0.5\n", "bytes": 1504, "sha": "57ffdb1e4a916424", "mtime": "2026-08-16 04:57"}, {"caminho": "modelos/LEIAME-copia-de-projeto.txt", "nome": "LEIAME-copia-de-projeto.txt", "texto": "MEGABRAIN — cópia sincronizada. NÃO EDITE os arquivos desta pasta.\n\nFonte canônica: <MEGABRAIN_ROOT>\nPara mudar qualquer coisa: edite a fonte e rode sincronizar-pipeline.cmd lá.\nA fonte manda; a cópia obedece.\n", "bytes": 217, "sha": "6b3958091b699240", "mtime": "2026-08-16 04:57"}, {"caminho": "referencias/260810_PROMPT-PORTATIL.md", "nome": "260810_PROMPT-PORTATIL.md", "texto": "# PROMPT PORTÁTIL\n\nCole em qualquer IA (ChatGPT, Gemini, Grok, DeepSeek, Mistral, Claude, Kimi).\nAutossuficiente — não depende de arquivo, ferramenta ou plataforma.\n\nDuas versões: **completa** (colar no início de um projeto/custom instruction)\ne **curta** (colar antes de um pedido pontual). Mais um módulo extra para\nprojetos de design.\n\nPara uma IA com acesso a arquivos, acrescente também o módulo de localização\nabaixo. Ele impede que uma instalação de outro computador vire premissa.\n\n---\n\n## ▓ MÓDULO LOCAL — IA com acesso a arquivos\n\n```\nANTES DE USAR O MEGABRAIN LOCAL:\nDefina <MEGABRAIN_ROOT> para a instalação deste usuário. Não suponha uma letra\nde unidade nem copie caminhos de outro computador.\n\nProcure, nesta ordem: (1) MEGABRAIN/ dentro do projeto atual; (2) a variável\nde ambiente MEGABRAIN_CENTRAL; (3) uma pasta ancestral ou do workspace que\ncontenha VERSAO.txt, MEGABRAIN.md, bin/mb-check-version.py e referencias/.\n\nSe encontrar uma única pasta válida, informe o caminho e use-o em todos os\ncomandos. Se houver mais de uma, liste as opções e peça para o usuário escolher.\nSe não encontrar nenhuma, pergunte exatamente: “Em qual pasta deste computador\nvocê salvou o MEGABRAIN? Cole o caminho da pasta raiz.” Valide os quatro itens\nantes de continuar.\n\nSe o MEGABRAIN ainda não estiver instalado, pergunte onde o usuário quer\nsalvá-lo e conduza a instalação usando esse local. Só depois continue com os\ngates. Nunca faça pull, sobrescreva arquivos ou envie ao Git antes de confirmar\no repositório e a autorização do usuário.\n```\n\n---\n\n## ▓ VERSÃO COMPLETA — copie tudo abaixo desta linha\n\n```\nPROTOCOLO DE EXECUÇÃO — siga em toda entrega não-trivial.\nEm pergunta rápida ou conversa casual, ignore isto e responda direto.\n\n## GATE ENQUADRAR (antes de qualquer output)\nResponda internamente. Se algo estiver vago, pergunte antes de produzir\n(máximo 2 perguntas, objetivas):\n1. Artefato: qual o objeto final e em que formato ele é aberto?\n2. Leitor: quem consome e que decisão essa pessoa toma depois?\n3. Critérios: escreva 3 critérios verificáveis de sucesso ANTES de gerar.\n4. Restrição dura: prazo, formato, marca, tom, limite técnico.\n5. Contraexemplo: descreva a versão óbvia e genérica que você produziria\n   por default. Nomeie-a. Você vai evitá-la.\n\n## GATE GERAR\n- Estrutura antes de prosa. Esqueleto, depois preenchimento.\n- Uma afirmação por parágrafo.\n- Específico > geral. \"Corta 3 dias de handoff\" > \"melhora a eficiência\".\n- Toda alegação sobre o mundo atual: busque antes ou marque\n  [ESTIMATIVA]. Nunca afirme de memória fatos que mudam\n  (preços, cargos, versões, leis, datas).\n\n## GATE AUDITAR (obrigatório — leia o que você escreveu e reescreva)\n\nA. LÉXICO — se apareceu, reescreva a FRASE (não troque o sinônimo):\nEN: delve, tapestry, testament to, ever-evolving landscape, navigate the\ncomplexities, unlock, harness, leverage, robust, seamless, game-changer,\nelevate, empower, cutting-edge, revolutionize, holistic, synergy, myriad,\nplethora, meticulous, crucial, pivotal, underscores, realm, beacon,\ncurated, streamline, transformative, foster, bespoke\nPT: no mundo de hoje, no cenário atual, cada vez mais, de forma eficaz,\né importante ressaltar, vale destacar, em suma, nesse sentido, dessa forma,\npor fim, revolucionar, potencializar, alavancar, robusto, impactante,\nentregar valor, jornada (vazio), ecossistema (vazio), curadoria (vazia),\nholística, sinergia, disruptivo, imersivo, solução completa, ponta a ponta\n\nB. ESTRUTURA — remova:\n- \"Não é apenas X — é Y\" (antítese oca)\n- Regra de três compulsiva (\"rápido, simples e poderoso\")\n- Travessão como muleta rítmica (máx. 1 a cada 3 parágrafos)\n- Parágrafo final que resume o que acabou de ser dito\n- Bullets \"**Rótulo:** frase\" onde prosa serviria\n- Abertura que reafirma a pergunta\n- Fechamento \"espero que ajude\" / \"me avise se quiser\"\n- Hedge empilhado (\"pode potencialmente às vezes\") — escolha o grau\n  de certeza e assuma\n- Parágrafos todos do mesmo comprimento — varie a cadência\n- Conectivo mentiroso: se remover \"além disso\" não muda o sentido,\n  ele estava fingindo uma relação lógica\n\nC. SUBSTÂNCIA — 4 testes:\n- \"E daí?\": remova o parágrafo. Perdeu algo? Se não, corte.\n- Substituição: troque o nome do cliente/produto por um concorrente.\n  Ainda faz sentido? Então é sobre a categoria, não sobre ele. Especifique.\n- Trade-off: toda recomendação declara o que custa? Sem contrapartida\n  é folheto de vendas, não conselho.\n- Fonte: todo número, data, preço, cargo, versão é verificado ou\n  rotulado como estimativa?\n\nD. COMPRESSÃO:\nReescreva 30% menor. Se nada essencial se perdeu, ENTREGUE A MENOR.\nSlop comprime sem perda. Argumento denso resiste.\n\n## GATE REPARAR (limitado a 1 rodada)\nUma reescrita. Loop de autocrítica sem limite converge para uma média\nhomogênea: corrige slop léxico e introduz slop estrutural. Se após\n1 reparo ainda está ruim, o problema é o ENQUADRAR, não a redação.\n\n## GATE VERIFICAR\nNúmeros recalculados · datas conferidas contra hoje · nomes e cargos\nverificados · links abrem · nada contradiz o que foi dito antes.\n\n## GATE REGISTRAR\nAo fim, em 3 linhas:\nGATILHO: quando essa situação reaparece\nLIÇÃO: o que deu errado ou foi descoberto\nATALHO: o que fazer direto da próxima vez\nRegistre só o que muda comportamento futuro. Se a mesma lição aparecer\n3 vezes, ela virou processo — escreva como instrução permanente.\n\n## REGRAS PERMANENTES\n- Não sei > invenção plausível. Diga o que não sabe.\n- Discordância fundamentada > concordância agradável.\n- Restrição gera forma. Opção infinita gera genérico.\n- Referência concreta > adjetivo (\"moderno\", \"profissional\", \"clean\"\n  não restringem nada).\n- Exemplos canônicos (2–3) > lista exaustiva de casos de borda.\n- Conciso ≠ raso. Corte enchimento, não argumento.\n```\n\n---\n\n## ▓ VERSÃO CURTA — para pedido pontual\n\n```\nAntes de responder: (1) liste 3 critérios verificáveis de sucesso;\n(2) descreva em uma linha a versão genérica que você produziria por\ndefault e comprometa-se a evitá-la.\n\nAo responder: específico > geral. Toda recomendação com trade-off\ndeclarado. Todo número com fonte ou marcado [ESTIMATIVA]. Nunca afirme\nde memória fatos que mudam.\n\nProibido: delve/leverage/robust/seamless/holistic/unlock/elevate/\nalavancar/potencializar/robusto/no mundo de hoje/vale destacar/em suma;\n\"não é apenas X, é Y\"; regra de três decorativa; parágrafo-resumo final;\nabrir reafirmando a pergunta; \"espero que ajude\"; hedge empilhado;\nparágrafos todos do mesmo tamanho.\n\nAntes de entregar: reescreva 30% menor. Se não perdeu nada, entregue a\nversão menor.\n```\n\n---\n\n## ▓ MÓDULO EXTRA — projetos de design\n\nAnexe ao protocolo quando a entrega for visual.\n\n```\nFASE (Duplo Diamante — declare em qual você está):\n1 Pesquisa (divergir) → 2 Análise (convergir) → 3 Ideação (divergir)\n→ 4 Design (convergir)\nNunca misture os modos: julgar durante a divergência mata as ideias boas;\ndivergir durante a convergência impede a decisão.\nNão passe do 2 sem enunciar o problema numa frase falseável.\nFidelidade proporcional à certeza: certeza baixa = fidelidade baixa.\n\nTRAVE ANTES DE COMPOR: grade · escala tipográfica (máx. 5 passos) ·\npaleta (máx. 3 famílias + neutros) · sistema de espaçamento.\n\nLÉXICO VISUAL BANIDO: gradiente roxo→azul · mesh gradient sem motivo ·\nglassmorphism não motivado · Inter/Poppins/Montserrat como default sem\njustificativa · radius 8px em tudo · drop shadow em tudo · foto de banco\ncom gente apontando pra laptop · grid de 3 cards ícone+headline+3 linhas ·\ndashboard fake · tudo centralizado · ilustração isométrica genérica ·\nmockup de iPhone flutuando em 3/4.\n\nTESTES: print sem logo (dá pra saber de quem é?) · hierarquia em 3\nsegundos · contraste WCAG AA (4.5:1 texto, 3:1 texto grande) · toda\ndecisão visual tem motivo declarável (por que 12px de radius?).\n```\n", "bytes": 8043, "sha": "c1ee9563a9429c00", "mtime": "2026-08-16 04:57"}, {"caminho": "referencias/260810_anti-slop.md", "nome": "260810_anti-slop.md", "texto": "# Anti-slop: detecção e reparo\n\n## O que é slop\n\nTexto (ou imagem) que passa numa leitura rápida e não sobrevive a uma segunda.\nSintomas: repetitivo, previsível, genérico, reconhecível como saída de máquina.\nNão é erro factual — é ausência de escolha.\n\n**Causa raiz técnica**: modelos de linguagem colapsam para os padrões de maior\nprobabilidade. Slop é o modo default. Evitá-lo exige restrição explícita, não\nboa vontade.\n\n**Regra de eficácia**: prompt sozinho resolve ~80% dos casos. Os 20% restantes\nexigem uma passada de validação separada com reparo limitado. Por isso o Gate 4\n(Auditar) é etapa própria, não adjetivo no prompt inicial.\n\n---\n\n## Camada 1 — Léxico\n\n### Inglês (marcadores fortes)\n```\ndelve, tapestry, testament to, in the ever-evolving landscape, navigate the\ncomplexities, unlock, harness, leverage, robust, seamless, game-changer,\nat its core, furthermore, moreover, in conclusion, let's dive in,\nthe world of, boasts, crucial, pivotal, underscores, beacon, realm,\nmyriad, plethora, meticulous, elevate, empower, cutting-edge, revolutionize,\nparadigm shift, holistic, synergy, curated, bespoke, streamline,\ntransformative, unparalleled, seamlessly integrate, foster, spearhead\n```\n\n### Português (marcadores fortes)\n```\nno mundo de hoje, no cenário atual, cada vez mais, de forma eficaz,\né importante ressaltar, vale destacar, cabe ressaltar, em suma,\nnesse sentido, dessa forma, por fim, dito isso, revolucionar,\npotencializar, alavancar, robusto, impactante, entregar valor,\njornada (sem trajeto real), ecossistema (sem sistema real),\ncuradoria (sem critério declarado), de forma holística, sinergia,\nassertivo (usado como \"certeiro\"), imersivo, disruptivo, escalável (vazio),\nsolução completa, ponta a ponta, fazer a diferença, nível de excelência\n```\n\n### Como reparar\n**Não troque por sinônimo.** `alavancar` → `usar` continua slop porque a frase\ninteira era vazia. Reescreva a frase respondendo: *o que exatamente acontece\naqui?*\n\n- ❌ \"Vamos alavancar o design system para potencializar a entrega.\"\n- ⚠️ \"Vamos usar o design system para melhorar a entrega.\" (menos feio, ainda vazio)\n- ✅ \"O design system corta ~3 dias de handoff porque o dev não precisa medir espaçamento.\"\n\n---\n\n## Camada 2 — Estrutura\n\n| Padrão | Por que é slop | Reparo |\n|---|---|---|\n| \"Não é apenas X — é Y\" | Antítese que finge profundidade sem afirmar nada | Afirme Y direto |\n| Regra de três compulsiva (\"rápido, simples e poderoso\") | Ritmo decorativo; o 3º item quase sempre é enchimento | Corte para 1 ou 2 reais |\n| Travessão em todo parágrafo | Muleta rítmica que apaga a variação de frase | Máx. 1 a cada 3 parágrafos |\n| Parágrafo-resumo no fim | Redundância; o leitor acabou de ler | Corte |\n| `**Rótulo:** frase` em toda bullet | Formata em vez de argumentar | Vire prosa ou tabela real |\n| Abertura reafirmando a pergunta | Zero informação nova | Comece pela resposta |\n| \"Espero que ajude!\" / \"Me avise se...\" | Preenchimento social | Corte |\n| Hedge empilhado (\"pode potencialmente às vezes\") | Medo de errar disfarçado de nuance | Escolha o grau de certeza e assuma |\n| Parágrafos de comprimento idêntico | Cadência de máquina | Varie: 1 linha, depois 5, depois 2 |\n| Bullets onde a relação entre itens importa | Bullet apaga causalidade | Prosa com conectivos reais |\n| \"Em conclusão / Em resumo\" | Anuncia o fim em vez de terminar | Termine |\n\n### Marcador estrutural mais difícil de ver\n**Parágrafos que abrem com o conectivo errado.** \"Além disso\", \"Ademais\",\n\"Por outro lado\" usados como cola em vez de relação lógica real. Teste: remova\no conectivo. Se o sentido não muda, ele estava mentindo sobre a relação entre\nos parágrafos.\n\n---\n\n## Camada 3 — Substância\n\nQuatro perguntas por peça. Falhou em uma, reescreva.\n\n1. **Teste do \"e daí?\"** — remova qualquer parágrafo. A peça perdeu algo? Se\n   não, ele nunca esteve lá.\n2. **Teste da substituição de marca** — troque o nome do produto/cliente por um\n   concorrente. Ainda faz sentido? Então não é sobre o cliente — é sobre a\n   categoria. Especifique.\n3. **Teste do trade-off** — toda recomendação declara o que ela custa?\n   Recomendação sem custo é folheto de vendas, não conselho.\n4. **Teste da fonte** — todo número, data, preço, nome de cargo, versão de\n   software é verificado ou explicitamente marcado como estimativa?\n\n### Extra para conteúdo técnico\n5. **Teste do falseamento** — a afirmação poderia ser falsa? Se nenhuma\n   evidência a contradiria, ela não afirma nada.\n\n---\n\n## Camada 4 — Compressão\n\nReescreva 30% menor. Se nada essencial se perdeu, entregue a versão menor.\n\nIsso não é sobre ser breve — é um **detector**. Slop comprime sem perda porque\né enchimento. Argumento denso resiste à compressão.\n\nSe você comprimiu 30% e a peça ficou *melhor*, comprima mais 20% e teste de novo.\n\n---\n\n## Slop visual (design)\n\nAplicável a qualquer entrega gráfica, incluindo o que outra IA gerar.\n\n### Léxico visual banido por default\n- Gradiente roxo→azul (o \"gradiente de IA\")\n- Fundo mesh gradient sem motivo\n- Glassmorphism não motivado (blur sem camada real por trás)\n- Inter / Poppins / Montserrat como escolha default sem justificativa\n- Border-radius 8px em tudo, sem hierarquia\n- Drop shadow em todo elemento\n- Foto de banco de imagem: pessoas apontando pra laptop, aperto de mão,\n  equipe rindo em reunião\n- Ícone linear + headline + 3 linhas de body, em grid de 3 cards\n- \"Dashboard fake\" com gráficos genéricos\n- Tudo centralizado\n- Ilustração isométrica genérica\n- Mockup de iPhone flutuando em ângulo 3/4\n\n### Testes estruturais de design\n1. **Teste do print sem logo** — cubra a marca. Dá pra dizer de que empresa é?\n2. **Teste da grade** — os alinhamentos são intencionais ou acidentais?\n3. **Teste da hierarquia em 3 segundos** — mostre por 3s. A pessoa lembra o\n   que era mais importante?\n4. **Teste da escala tipográfica** — mais de 5 tamanhos na mesma peça =\n   decisão não tomada.\n5. **Teste do contraste** — WCAG AA (4.5:1 texto normal, 3:1 texto grande).\n   Não é acessibilidade opcional, é legibilidade.\n6. **Teste da restrição** — a paleta e a escala foram travadas *antes* do\n   layout? Se não, o resultado vai divergir.\n\n### Reparo visual\nSlop visual quase sempre é **ausência de restrição, não excesso de opção**.\nTrave antes de compor: grade, escala tipográfica (máx. 5 passos), paleta\n(máx. 3 famílias + neutros), sistema de espaçamento. A restrição gera a forma.\n\n---\n\n## Validador rápido (checklist de 60s)\n\n```\n[ ] Zero palavras da lista de léxico\n[ ] Zero \"não é apenas X — é Y\"\n[ ] Menos de 1 travessão a cada 3 parágrafos\n[ ] Sem parágrafo-resumo final\n[ ] Sem \"espero que ajude\" / \"me avise\"\n[ ] Comprimentos de parágrafo variados\n[ ] Passa no teste da substituição de marca\n[ ] Toda recomendação tem trade-off declarado\n[ ] Todo número tem fonte ou marca de estimativa\n[ ] Sobreviveu à compressão de 30%\n```\n\n---\n\n## Limite\n\nUma rodada de reparo. Ciclos de autocrítica sem limite fazem o texto convergir\npara uma média homogênea — corrige slop léxico e introduz slop estrutural.\nSe após 1 reparo ainda não está bom, o problema é o **enquadramento**, não a\nredação.\n", "bytes": 7336, "sha": "362078d96e84ce3a", "mtime": "2026-08-16 04:57"}, {"caminho": "referencias/260810_context-engineering.md", "nome": "260810_context-engineering.md", "texto": "# Context engineering\n\n> Contexto é recurso **finito e degradante**. Não é depósito: é orçamento.\n\n---\n\n## Os quatro modos de falha\n\n| Falha | Sintoma | Correção |\n|---|---|---|\n| **Poluição** | Informação irrelevante disputa atenção com a relevante | Ler sob demanda; grep antes de read |\n| **Context rot** | Qualidade cai em contexto longo mesmo sem estourar o limite | Checkpoint em arquivo; recomeçar sessão |\n| **Ferramenta inchada** | Modelo escolhe a ferramenta errada | Conjunto mínimo viável |\n| **Perda de meio** | Instrução no meio de prompt longo é ignorada | Crítico no início e repetido no fim |\n\n---\n\n## Técnicas\n\n### 1. Leitura sob demanda\nNunca despeje pasta ou repositório inteiro. Sequência: `Glob` (achar) → `Grep`\n(localizar trecho) → `Read` (só o trecho, com offset/limit).\n\nRegra: **leia o arquivo quando precisar dele, não guarde o arquivo na\nmemória.** Reler 40 linhas é mais barato que carregar 4000 e degradar todo o\nresto da sessão.\n\n### 2. Compactação\nEm tarefa longa, resuma o trecho concluído e descarte o bruto. O que sobrevive:\ndecisões tomadas, restrições descobertas, estado atual. O que morre: o caminho\naté lá.\n\n### 3. Nota estruturada (a técnica mais subestimada)\nEscreva o estado num `.md` de trabalho em vez de carregar na janela.\n\n```markdown\n# 260804_estado.md\n## Decidido\n- Paleta travada: #161616 / #F2F2F2 / #FF4D00\n- Formato final: .pptx 16:9, entrega 06/08\n\n## Aberto\n- Fonte do título: aguardando aprovação do cliente\n\n## Descartado (não reabrir)\n- Versão com gradiente — cliente rejeitou 04/08\n```\n\nO arquivo não sofre context rot. A janela sofre. Sessão longa = mova a memória\npro disco.\n\n> A seção \"Descartado (não reabrir)\" é o que impede o agente de reciclar ideia\n> morta na iteração seguinte.\n\n### 4. Agente separado para trabalho barulhento\nPesquisa ampla, varredura de arquivos, coleta de dados → delegue a um agente\nseparado (sob pedido explícito): ele queima o contexto *dele* e\ndevolve só a conclusão.\n\nDelegue: busca ampla · leitura de muitos arquivos · verificação independente ·\nexploração de alternativas.\nNão delegue: decisão que depende do histórico da conversa · trabalho que exige\no contexto acumulado.\n\nAgente **específico** bate genérico. \"Auditar contraste WCAG nas 6 telas\" >\n\"agente de QA\".\n\n### 5. Conjunto mínimo viável de ferramentas\n*Se um humano não consegue dizer com certeza qual ferramenta usar numa dada\nsituação, o agente também não consegue.* Ferramenta ambígua = contexto\ndesperdiçado em decisão errada.\n\n### 6. Divulgação progressiva (3 níveis)\n```\nNível 1  descrição da skill (sempre em contexto)  ~30 palavras\nNível 2  corpo da SKILL.md (ao disparar)          <500 linhas\nNível 3  arquivos de referência (sob demanda)     sem limite prático\n```\nÉ por isso que o MEGABRAIN é fatiado em `referencias/` e não num monólito.\n\n---\n\n## Orçamento prático de sessão\n\n| Zona | Comportamento |\n|---|---|\n| 0–50% | Normal |\n| 50–70% | Comece a compactar; escreva estado em arquivo |\n| 70–85% | Delegue trabalho novo; não abra arquivo grande |\n| >85% | Escreva handoff completo em `.md` e recomece a sessão |\n\nHandoff mínimo: objetivo · decidido · aberto · descartado · próximo passo ·\ncaminhos dos arquivos (template pronto: T6 em `260810_metaprompt-templates.md`).\n\n---\n\n## Como isso costuma dar errado\n\n1. **Ler preventivamente \"pra ter contexto\".** Isso não é contexto, é ruído.\n2. **Confiar na memória de 200 mensagens atrás.** Não confie — releia o arquivo.\n3. **Um agente genérico pra tudo.** Ele devolve resumo genérico.\n4. **System prompt gigante.** Custa em toda sessão, inclusive nas que não\n   precisam.\n5. **Compactar cedo demais.** Compactar antes de decidir apaga a informação que\n   sustentava a decisão. Compacte depois de fechar o bloco.\n", "bytes": 3867, "sha": "23fa93c3aae56d75", "mtime": "2026-08-16 04:57"}, {"caminho": "referencias/260810_design-projects.md", "nome": "260810_design-projects.md", "texto": "# Projetos de design: Duplo Diamante + craft de superfície\n\nBase: Double Diamond, do UK Design Council.\n\n> ⚠️ O Duplo Diamante **não é prescritivo**. O que não muda é a ordem:\n> entender antes de resolver.\n\n## Nomenclatura — os dois vocabulários\n\n| Design Council (oficial) | Prático (UX) | Modo |\n|---|---|---|\n| **Discover** | Pesquisa | divergir |\n| **Define** | Análise | convergir |\n| **Develop** | Ideação | divergir |\n| **Deliver** | Design | convergir |\n\nUse o vocabulário do cliente. Se ele fala Discover/Define, não traduza.\n\n---\n\n## O princípio operacional\n\nDois losangos, quatro estágios, alternando modo de pensamento:\n\n```\n        DIAMANTE 1 (problema)          DIAMANTE 2 (solução)\n    ◇ Pesquisa → Análise ◇        ◇ Ideação → Design ◇\n    divergir      convergir        divergir    convergir\n```\n\n**Divergir** = gerar amplo, sem julgamento, sem fronteira.\n**Convergir** = estreitar, avaliar, escolher 1–2 e descartar o resto.\n\nO erro clássico não é pular estágio — é **misturar os modos**. Julgar durante\na divergência mata as ideias boas; divergir durante a convergência impede a\ndecisão. Antes de qualquer sessão, declare em qual modo você está.\n\n---\n\n## Os 4 estágios — atividades, outputs e engajamento\n\n### Estágio 1 — PESQUISA (divergente)\n> Entender o problema em vez de assumir.\n\n**Atividades:** entrevistas (usuários, clientes, SMEs) · personas · mapa de\nempatia · desk research · análise competitiva · coleta de dados\n\n**Outputs:** necessidades do cliente · achados brutos · transcrições\n\n**Stakeholder:** nenhum ainda. Não apresente pesquisa crua.\n\n**Armadilha:** tarefa-lista. Não rode todas as atividades — escolha pelo\ntempo, recurso e resultado necessários.\n\n---\n\n### Estágio 2 — ANÁLISE (convergente)\n> Os insights redefinem o desafio.\n\n**Atividades:** customer journey map · pain points · jobs to be done · causa\nraiz · insights & temas · perguntas \"How might we\"\n\n**Outputs:** problema definido · declarações \"How might we\" · oportunidades\n\n**Stakeholder:** 🚪 **primeiro stage gate** — apresentação aos patrocinadores.\n\n**Técnicas de convergência:**\n- **Affinity diagramming** — agrupe os achados em temas até o padrão aparecer\n- **5 porquês** — cave abaixo do sintoma até a causa raiz\n- **\"How might we\"** — reformule o insight em pergunta aberta\n\n**A frase de problema.** É o output que importa. Formato: *quem* precisa de\n*o quê*, **porque** *evidência da pesquisa*.\n\nO objetivo do Define não é listar todos os problemas — é enunciar **o único\nque mais importa**, para o usuário e para o negócio.\n\n**Armadilha:** pular de \"achados\" para \"solução\" sem o problema escrito numa\nfrase falseável. Desconfie de Define que só confirma o que o time já achava —\nisso indica Discover curto demais.\n\n---\n\n### Estágio 3 — IDEAÇÃO (divergente)\n> Gerar amplo, traduzir em protótipo barato.\n\n**Atividades:** workshops · sketches / protótipos rápidos · user flows ·\nwireframes / conceitos · teste de conceito\n\n**Outputs:** ideias · mapas de fluxo · conceitos · baixa fidelidade\n\n**Stakeholder:** sense check informal.\n\n**Time-boxing é obrigatório aqui.** Divergência sem limite vira paralisia por\nanálise. Crazy 8s (8 ideias em 8 minutos) existe para forçar o salto além das\n2 ou 3 primeiras ideias óbvias. Defina o prazo de decisão *antes* de abrir a\nsessão.\n\n**Regra de saída:** saia com 2–4 conceitos distintos e testáveis, não com um\nvencedor. Conceito único não é convergência, é falta de exploração.\n\n**Armadilha:** alta fidelidade cedo. Fidelidade alta compra comprometimento\nemocional e mata a divergência.\n\n---\n\n### Estágio 4 — DESIGN (convergente)\n> Testar em pequena escala, rejeitar o que não funciona, iterar até fechar.\n\n**Atividades:** alta fidelidade · design reviews · testes de usabilidade\n\n**Outputs:** designs finais · solução · protótipos funcionais\n\n**Stakeholder:** 🚪 **segundo stage gate** — apresentação final.\n\n**Métricas de teste de usabilidade** — substituem \"achei que ficou bom\":\n\n| Métrica | Mede |\n|---|---|\n| Task completion rate | O fluxo funciona no cenário real? |\n| Time on task | Eficiência — crítico em ferramenta de trabalho |\n| Error rate | Aponta a tela exata que confunde |\n| SUS | Nota comparável entre versões |\n\nEscolha 2. Medir as 4 em teste de 5 pessoas gera número sem significância.\n\n---\n\n## Armadilhas por fase\n\n| Armadilha | Fase | Correção |\n|---|---|---|\n| **Correr a pesquisa** | Discover | Plano de pesquisa escrito antes: objetivo, perguntas, quantas pessoas |\n| **Construir sobre premissa** | Discover/Define | Entrevista direta obrigatória antes da frase de problema |\n| **Stakeholder desalinhado** | Todas | Cadência fixa de review curto. Faça o stakeholder *ver* a pesquisa |\n| **Ideação infinita** | Develop | Time-boxing + prazo de decisão definido antes |\n| **Fidelidade alta cedo** | Develop | Baixa fidelidade até ter dado de teste |\n| **Convergir sem dado** | Deliver | Métrica declarada antes do teste |\n\nA mais cara é a primeira. Cortar Discover parece economizar tempo, mas\ntransfere o custo para a engenharia — onde ele é multiplicado.\n\n---\n\n## Regras de qualidade específicas de design\n\nComplementam o anti-slop (`260810_anti-slop.md`, camada visual).\n\n1. **Trave a restrição antes de compor.** Grade, escala tipográfica (máx. 5\n   passos), paleta (máx. 3 famílias + neutros), sistema de espaçamento.\n2. **Referência antes de descrição.** Direção visual definida por referência\n   concreta bate adjetivo em qualquer projeto — como montar e usar a\n   biblioteca: `260810_galerias-referencia.md`.\n3. **Teste do print sem logo.** Cubra a marca. Dá pra dizer de quem é?\n4. **Contraste é legibilidade.** WCAG AA: 4.5:1 texto normal, 3:1 texto grande.\n5. **Fidelidade proporcional à certeza.** Baixa certeza = baixa fidelidade.\n6. **Toda decisão visual tem motivo declarável.** Se você não consegue dizer\n   por que o radius é 12px, ele deveria ser 0.\n\n---\n\n## Quando a entrega vira código (DOM)\n\nPeça estática, deck, print, 3D e motion sem DOM ficam inteiramente neste\narquivo + Gate 4.5. Landing, dashboard, app UI, form — que **viram código**\n— saem daqui: roteiro completo, modos de superfície e piso de craft em\n`260810_impeccable-routing.md`. O Duplo Diamante continua governando a\n*fase* do projeto; o craft de código é uma camada extra sobre ela.\n\n---\n\n## Encaixe com Agile / Scrum\n\n- **Duplo Diamante** responde *o quê* construir e *por quê*\n- **Agile / Scrum** responde *como* construir bem\n\nArranjo padrão: design roda **1–2 sprints à frente** do desenvolvimento.\nFalha comum: design vira \"fábrica de tela\" e o primeiro diamante desaparece.\nSe a pesquisa não tem sprint própria, ela não acontece.\n\n---\n\n## Papéis mínimos\n\n| Papel | Dono de |\n|---|---|\n| Produto | O \"porquê\" — alinhamento com objetivo de negócio |\n| Pesquisa (UX) | Discover — extrair o insight |\n| Designer de produto | Traduzir insight em protótipo e peça final |\n| Engenharia (lead) | Checagem de viabilidade **durante**, não no fim |\n\nTrabalhando solo, você acumula os quatro. O risco específico do solo é pular a\nchecagem de viabilidade e o desalinhamento — os dois papéis que existem para\nte contradizer. Compense marcando conversa explícita com dev e cliente ao fim\ndas fases 2 e 4.\n\n---\n\n## Duração\n\nNão há número certo. O critério não é calendário — é se a fase entregou o\noutput dela. Discover terminou quando parou de aparecer surpresa nas\nentrevistas. Define terminou quando existe a frase de problema.\n\n**Custo declarado:** o Duplo Diamante atrasa o primeiro pixel. Em projeto com\nescopo travado e problema validado, ele é overhead. Use quando há incerteza\nreal sobre *qual* é o problema.\n\n---\n\n## Quando NÃO usar o Duplo Diamante\n\n- Escopo travado e problema já validado → vá direto ao Estágio 3/4\n- Peça pontual (um post, um banner) → Gates 1, 4 e 6 bastam\n- Prazo menor que 48h com briefing sólido → design sprint condensado\n- Cliente que já decidiu a solução e quer execução → declare o risco por\n  escrito uma vez, depois execute\n", "bytes": 8219, "sha": "449eacf17197087b", "mtime": "2026-08-16 04:57"}, {"caminho": "referencias/260810_evaluation-gates.md", "nome": "260810_evaluation-gates.md", "texto": "# Avaliação: rubricas e gates\n\nPrincípio: **\"está bom?\" não é falseável. \"atende ao critério 2?\" é.**\nSem rubrica escrita antes da geração, autocrítica vira opinião — e opinião de\nmodelo converge para \"ficou ótimo\".\n\n---\n\n## Como escrever uma rubrica utilizável\n\nTrês a cinco critérios. Cada um precisa ser:\n- **Verificável** — dá pra apontar a evidência no texto/arquivo\n- **Independente** — não é reformulação de outro critério\n- **Falseável** — existe uma versão que falharia\n\n```\n❌ \"Deve ser de alta qualidade\"        (não falseável)\n❌ \"Deve ser claro e conciso\"          (dois critérios, ambos vagos)\n✅ \"Toda recomendação declara seu custo, citável no texto\"\n✅ \"Nenhum parágrafo sobrevive à remoção sem perda\"\n✅ \"Todo número tem fonte ou rótulo [ESTIMATIVA]\"\n```\n\n---\n\n## Rubricas prontas\n\n### Texto entregável (proposta, artigo, relatório)\n1. Um leitor específico toma uma decisão específica depois de ler. Qual?\n2. Passa no teste da substituição de marca (troque o cliente pelo\n   concorrente — quebra?)\n3. Toda recomendação tem trade-off declarado\n4. Zero itens do léxico banido; zero \"não é apenas X, é Y\"\n5. Sobrevive à compressão de 30% sem perda de argumento\n\n### Peça de design\n1. Restrição travada antes da composição (grade, escala tipo, paleta,\n   espaçamento)\n2. Hierarquia legível em 3 segundos\n3. Contraste WCAG AA (4.5:1 / 3:1)\n4. Passa no teste do print sem logo\n5. Toda decisão visual tem motivo declarável\n6. Zero itens do léxico visual banido\n\n### Código / script\n1. Roda no ambiente-alvo real, não só na cabeça\n2. Caso de erro tratado explicitamente, não engolido\n3. Nenhum valor mágico sem nome\n4. Testável sem mock de tudo\n5. Diff mínimo — não reescreve o que não precisava mudar\n\n### Apresentação\n1. Um slide = uma ideia\n2. Título do slide é a afirmação, não o rótulo (\"Receita caiu 12% no Q2\" >\n   \"Receita\")\n3. Todo gráfico responde a uma pergunta declarada\n4. Roteiro de fala existe e cabe no tempo\n5. Slide final tem a decisão pedida, não \"obrigado\"\n\n---\n\n## Protocolo de pontuação\n\n```\nPara cada critério: nota 1–5 + citação da evidência.\nSem citação → a nota não conta, refaça a avaliação.\nQualquer critério < 4 → reescreva SÓ o que falhou.\nUma rodada de reparo. Depois disso, volte ao enquadramento.\n```\n\n**Por que citar a evidência:** obriga a avaliação a olhar o artefato real em\nvez de julgar a intenção. Nota sem citação é sempre 4.\n\n---\n\n## Verificação independente\n\nPara trabalho de alto risco (cliente, dinheiro, prazo público), a autoavaliação\nnão basta — quem gerou está ancorado no próprio raciocínio.\n\nDelegue a um agente separado com **só o artefato e a rubrica**, sem o\nhistórico (template pronto: T4 em `260810_metaprompt-templates.md`):\n\n```\nVocê recebe um artefato e uma rubrica. Não sabe como ele foi feito\ne não deve assumir boa intenção. Pontue cada critério 1–5 com\ncitação. Liste as 3 objeções mais fortes de quem rejeitaria isso.\n```\n\nContexto zero é a característica útil aqui, não uma limitação. Refinamento:\nrode a avaliação crítica e qualquer checagem determinística (script, lint,\ndetector) **sem uma ver a outra**; a síntese só depois — output determinístico\nancora o julgamento se chegar primeiro.\n\n---\n\n## Verificação factual\n\nCamada separada da rubrica. Sempre que a peça afirma algo sobre o mundo:\n\n- [ ] Números recalculados, não copiados\n- [ ] Datas e prazos conferidos contra a data de hoje\n- [ ] Nomes de pessoa/cargo/empresa verificados (mudam)\n- [ ] Preços e planos verificados (mudam)\n- [ ] Versões de software verificadas (mudam)\n- [ ] Links abrem\n- [ ] Nenhuma afirmação sobre o presente vinda só de memória do modelo\n\nRegra dura: qualquer fato sobre o mundo atual → buscar antes. Confiança não\nsubstitui verificação.\n\n---\n\n## Verificação de artefato\n\n- [ ] O arquivo abre no app de destino (não só \"foi gerado\")\n- [ ] Entrega fora do repo com prefixo `YYMMDD_`\n- [ ] Fontes embutidas / imagens não quebradas\n- [ ] Caminhos referenciados existem\n- [ ] Tamanho razoável (arquivo de 4KB que deveria ter 40 páginas = falha\n      silenciosa)\n\n---\n\n## Como isso costuma dar errado\n\n1. **Rubrica escrita depois da geração.** Ela se molda ao que já existe.\n   Escreva antes.\n2. **Autoavaliação sem citação.** Vira 4/5 em tudo.\n3. **Critério que é reformulação de outro.** Dá falsa sensação de cobertura.\n4. **Reparar mais de uma vez.** Homogeneíza.\n5. **Verificar o formato e não o conteúdo.** O arquivo abre e está errado.\n", "bytes": 4611, "sha": "a675f009c52781c6", "mtime": "2026-08-16 04:57"}, {"caminho": "referencias/260810_galerias-referencia.md", "nome": "260810_galerias-referencia.md", "texto": "# Galerias de referência: como ancorar direção visual\n\nComplementa `260810_design-projects.md` (Estágios 1 e 3) e a regra \"referência\nantes de adjetivo\" do anti-slop visual.\n\n## Por que galeria, não adjetivo\n\n\"Moderno\", \"clean\", \"premium\" não restringem nada — cada pessoa lê um layout\ndiferente atrás da palavra. Uma URL concreta restringe: dá pra apontar o\nmecanismo exato (hierarquia, ritmo, contraste) e discordar dele com precisão.\n\n## Regras de uso\n\n- Vá com a pergunta escrita (\"como X trata hierarquia de preço?\"), não \"me\n  inspira\" — pergunta vaga devolve resposta vaga.\n- 2–3 referências, não 20. Board de vinte é indecisão organizada em grade.\n- Nomeie a **anti-referência** junto — o que se evita restringe mais que o\n  que se busca.\n- Extraia o **mecanismo** (por que aquela hierarquia funciona) e descarte a\n  forma. Copiar composição é slop com endereço melhor.\n- Use nas fases divergentes (Pesquisa, Ideação). Referência durante a\n  convergência reabre o que já fechou.\n\n## Como montar a própria biblioteca por sintoma\n\nOrganize por **pergunta que a galeria responde**, não por categoria de\nmercado — uma galeria de \"sites bonitos\" não ajuda quando o problema é \"como\ntratar um formulário de erro\". Estrutura sugerida:\n\n| Sintoma / pergunta | Tipo de galeria a buscar |\n|---|---|\n| \"Preciso de volume, várias soluções pro mesmo problema\" | Diretório de varredura ampla (curadoria mínima, muito volume) |\n| \"Preciso do teto de ambição do estilo\" | Diretório de prêmios/curadoria seca (enviesa para espetáculo — ruim para ferramenta de trabalho) |\n| \"É construível? Como fazem essa técnica em código\" | Diretório com código aberto / write-ups técnicos |\n| \"Como um produto real trata Operate/Read (dashboard, docs)?\" | Diretório de screenshots de produto real, não de landing pages |\n| \"Como se comporta estado, feedback, HUD?\" | Referência de UI de jogos — mesmos problemas de um dashboard sem a timidez do SaaS |\n| \"Preciso de uma seção isolada, não a página inteira\" | Diretório de componentes/seções recortadas |\n| \"Material e atmosfera, não layout\" | Portfólio de arte/ilustração — ordenar por comunidade (em alta) ou tendência (já saturou), com desconfiança |\n\nRegra: nomear a referência usada; se nenhuma servir, dizer isso em vez de\ninventar adjetivo. Cruzar UI de produto real (lógica de estado) + referência\nde material (atmosfera) + galeria de composição web (ritmo) é o que produz\nsuperfície que não parece template.\n\nEstas galerias enviesam para Persuade/Experience (site autoral, lançamento);\npara Operate e Read, prefira sempre o produto real que a pessoa já abre todo\ndia — o screenshot de UI real bate qualquer galeria curada.\n", "bytes": 2754, "sha": "81ce06d8bf19ba61", "mtime": "2026-08-16 04:57"}, {"caminho": "referencias/260810_gates-entrega.md", "nome": "260810_gates-entrega.md", "texto": "# Gates de execução — o protocolo de toda entrega não-trivial\n\nEsta é a **camada micro** do MEGABRAIN: o PIPELINE.md governa o projeto\n(estado → spec → … → publicar); estes gates governam **cada entrega** dentro\ndele — arquivo, peça, proposta, deck, código, análise, resposta longa.\n\nRode em **entrega não-trivial**. Em pergunta rápida ou conversa casual,\n**não rode** — aqui o protocolo é o próprio slop.\n\n## TL;DR\n\nenquadrar → orçar contexto → gerar → auditar → reparar (1×) → verificar → registrar.\nO Gate 4 é o que separa entrega de slop. Ele só existe se o texto mudou.\n\n---\n\n## 1. Gate ENQUADRAR — antes de qualquer token de output\n\nResponda internamente. Se algo estiver vago, **pergunte antes de produzir**\n(máx. 2 perguntas objetivas).\n\n1. **Artefato** — qual o objeto final e em que app ele é aberto? (.pptx, .fig,\n   .md, código, imagem)\n2. **Leitor** — quem consome e que decisão essa pessoa toma de
