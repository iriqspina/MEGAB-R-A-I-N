pois de ler/ver?\n3. **Critério de aprovação** — escreva 3 critérios verificáveis *antes* de gerar.\n4. **Restrição dura** — prazo, formato, marca, tom, limite técnico.\n5. **Contraexemplo** — como seria a versão óbvia e genérica disso? Nomeie.\n   Você vai evitá-la.\n\n> Item 5 é o truque mais barato do kit. Nomear o slop esperado reduz a chance\n> de produzi-lo.\n\nSe for projeto de **design**: declare a fase do Duplo Diamante e não misture os\nmodos — roteiro completo em `260810_design-projects.md`.\n\n---\n\n## 2. Gate ORÇAR CONTEXTO\n\nContexto é orçamento, não depósito.\n\n- **Leia sob demanda.** Glob → Grep → Read do trecho. Nunca despeje pasta.\n- **Checkpoint em arquivo.** Tarefa longa: escreva estado/decisões num `.md` de\n  trabalho. Contexto longo degrada; o arquivo não.\n- **Subagente para trabalho barulhento** (sob pedido explícito):\n  pesquisa ampla, varredura, coleta → devolva só a conclusão.\n- **Exemplos canônicos, não exaustivos.** 2–3 representativos batem 15 casos\n  de borda.\n- Acima de ~85% do contexto: escreva handoff (`objetivo / decidido / aberto /\n  descartado / próximo passo / arquivos`) e recomece.\n\nDetalhe: `260810_context-engineering.md`.\n\n---\n\n## 3. Gate GERAR\n\n- Estrutura antes de prosa. Esqueleto → preencher.\n- Uma afirmação por parágrafo.\n- Toda alegação factual sobre o mundo atual → **buscar antes**, nunca de\n  memória (preços, cargos, versões, leis, datas).\n- Números, datas, preços: verificados ou marcados `[ESTIMATIVA]`.\n- Específico > geral. \"Reduz 40% do tempo de export\" > \"melhora a eficiência\".\n\n---\n\n## 4. Gate AUDITAR — anti-slop (obrigatório)\n\nReleia o que gerou e **reescreva**. Listas completas: `260810_anti-slop.md`.\n\n### 4.1 Léxico\nSe apareceu, reescreva a frase inteira (não troque o sinônimo — a frase era vazia):\n\nEN: `delve, tapestry, testament to, ever-evolving landscape, navigate the\ncomplexities, unlock, harness, leverage, robust, seamless, game-changer,\nelevate, empower, cutting-edge, revolutionize, holistic, synergy, myriad,\nplethora, meticulous, crucial, pivotal, underscores, realm, beacon, curated,\nstreamline, transformative, foster, bespoke`\n\nPT: `no mundo de hoje, no cenário atual, cada vez mais, de forma eficaz,\né importante ressaltar, vale destacar, em suma, nesse sentido, dessa forma,\npor fim, revolucionar, potencializar, alavancar, robusto, impactante,\nentregar valor, jornada (vazio), ecossistema (vazio), curadoria (vazia),\nholística, sinergia, disruptivo, imersivo, solução completa, ponta a ponta`\n\n### 4.2 Estrutura\n- ❌ \"Não é apenas X — é Y\" (antítese oca)\n- ❌ Regra de três compulsiva (\"rápido, simples e poderoso\")\n- ❌ Travessão como muleta de ritmo (máx. 1 a cada 3 parágrafos)\n- ❌ Parágrafo final que repete o que acabou de ser dito\n- ❌ Abrir reafirmando a pergunta do usuário\n- ❌ Fechar com \"Me avise se quiser...\" / \"Espero que ajude!\"\n- ❌ Hedge empilhado — escolha o grau de certeza e assuma\n- ❌ Todos os parágrafos com o mesmo comprimento\n- ❌ Conectivo mentiroso: se remover \"além disso\" não muda o sentido, ele\n  fingia uma relação lógica\n\n### 4.3 Substância\n- **\"E daí?\"** — remova o parágrafo. A peça perdeu algo? Se não, corte.\n- **Substituição de marca** — troque o cliente pelo concorrente. Ainda faz\n  sentido? Então é sobre a categoria. Especifique.\n- **Trade-off** — toda recomendação declara o que custa?\n- **Fonte** — todo número verificado ou rotulado `[ESTIMATIVA]`?\n\n### 4.4 Compressão\nReescreva 30% menor. Se nada essencial se perdeu, **entregue a versão menor.**\n\n### Reparo\n**Uma rodada, limitada.** Loop de autocrítica sem limite converge para uma\nmédia homogênea. Se após 1 reparo ainda está ruim, o problema é o\nenquadramento (Gate 1), não a redação.\n\n---\n\n## 5. Gate VERIFICAR\n\n- Arquivo abre no app de destino? Formato correto? Convenção de nome?\n- Links/caminhos existem?\n- Números conferem (recalcule, não copie)? Datas contra hoje?\n- Contradiz algo dito antes na sessão?\n\nRubricas prontas por tipo de peça e verificação independente:\n`260810_evaluation-gates.md`.\n\n---\n\n## 6. Gate REGISTRAR\n\nAo fim de tarefa não-trivial, **registre a lição sem pedir permissão**:\nGATILHO/LIÇÃO/ATALHO no arquivo de lições do projeto (fonte canônica).\nInforme em UMA linha o que gravou. Nunca pergunte \"quer que eu registre?\" —\nautorização permanente já concedida por padrão neste protocolo.\n\n---\n\n## 7. Precedência de formato\n\n**Formato que o usuário pediu explicitamente vence este protocolo.** Seções\nfixas, TL;DR obrigatório, emojis de seção: mantenha exatamente — o protocolo\ngoverna o **conteúdo** dentro das seções, nunca a estrutura delas.\n\nOrdem: **formato pedido > protocolo > default do modelo.**\n\n---\n\n## 8. Referências desta camada (carregue sob demanda)\n\n| Arquivo | Quando ler |\n|---|---|\n| `260810_anti-slop.md` | Escrita, copy, qualquer texto ou peça visual entregue |\n| `260810_metaprompt-patterns.md` | Construir/refinar prompt ou brief |\n| `260810_metaprompt-templates.md` | Templates T1–T8 prontos pra preencher |\n| `260810_context-engineering.md` | Tarefa longa, muitos arquivos, contexto caro |\n| `260810_evaluation-gates.md` | Definir rubrica e avaliar output |\n| `260810_design-projects.md` | Projeto visual/design (4 estágios, craft) |\n| `260810_PROMPT-PORTATIL.md` | Levar o protocolo pra outra IA (colável) |\n| `260810_workflow-architecture.md` | Decidir skill vs system prompt vs script |\n\n---\n\n## Como isso costuma dar errado\n\n1. **Rodar os gates como teatro.** Anunciar \"✅ auditoria concluída\" sem\n   reescrever nada. O gate só existe se o texto mudou.\n2. **Auditar antes de gerar.** A auditoria é sobre o texto real.\n3. **Loop de crítica infinito.** Passa de 1 reparo, vira mingau homogêneo.\n4. **Atropelar o formato do usuário.** O formato dele vence.\n5. **Confundir conciso com raso.** Anti-slop corta enchimento, não argumento.\n6. **Aplicar em conversa casual.** O protocolo é pra entrega.\n7. **Registrar lição que não muda ação futura.** Vira lixo de contexto.\n", "bytes": 7060, "sha": "6bafbe7ad576044d", "mtime": "2026-08-16 04:57"}, {"caminho": "referencias/260810_impeccable-routing.md", "nome": "260810_impeccable-routing.md", "texto": "# Quando a entrega vira código: roteamento pra fora do Duplo Diamante\n\nPeça estática — deck, print, imagem, 3D, motion sem DOM — fica inteira em\n`260810_design-projects.md` + Gate 4 (anti-slop visual). Este arquivo cobre\no caso em que a entrega **vira código que roda num navegador ou app**:\nlanding page, dashboard, app UI, formulário, componente.\n\n## Por que sai do protocolo de design puro\n\nPeça estática se avalia por captura de tela. Interface em código se avalia\nem execução: estado, breakpoint, foco de teclado, erro de rede — nenhum\ndesses aparece num PNG. Aplicar só o Gate 4 (anti-slop visual) nessa entrega\naudita a composição e ignora o comportamento, que é metade do produto.\n\n## Os 4 modos de superfície\n\nDefine o que \"bom\" significa **antes de qualquer pixel** — o modo é da\nsuperfície, não do produto (a landing de uma ferramenta é Persuade; a\ndocumentação de uma marca é Read):\n\n| Modo | Objetivo | Exemplo |\n|---|---|---|\n| **Persuade** | O visitante decide e age | Landing page, página de marketing |\n| **Operate** | Completa uma tarefa | Dashboard, ferramenta interna, admin |\n| **Read** | Entende algo | Documentação, conteúdo editorial |\n| **Experience** | Está dentro da obra | Site autoral, portfólio |\n\n## Piso de craft (número, não adjetivo)\n\n- Medida de linha: 65–75ch no corpo de texto.\n- Display: no máximo 6rem.\n- Tracking: não abaixo de -0.04em.\n- Line-height: 1.5–1.7 no corpo.\n- Contraste: 4.5:1 (texto normal) e 3:1 (texto grande) — WCAG AA.\n- Espaço acima do heading maior que o espaço abaixo dele.\n- Sombra com offset e blur — halo colorido de offset zero é decoração, não\n  profundidade.\n\n## Checagem determinística antes da inspeção no olho\n\nRode primeiro o que roda como script — lint de UI, detector de contraste,\nde heading pulado, de linha longa — **sem** deixar a crítica subjetiva ver o\nresultado antes. O número ancora o julgamento; se a crítica vier primeiro,\nela racionaliza o que já decidiu gostar.\n\n## Roteamento prático\n\n1. A entrega tem estado, interação ou responde a breakpoint? → Este arquivo\n   governa o craft; `260810_design-projects.md` ainda governa a fase (em\n   qual estágio do Duplo Diamante o projeto está).\n2. Pixel e papel sem DOM → fica só em `260810_design-projects.md`.\n3. Se o ambiente tiver uma skill dedicada a design responsivo/UI de app\n   (ex.: uma skill de \"frontend design\"), use-a para a implementação —\n   este arquivo define o que medir, não como codificar.\n\n## Como isso costuma dar errado\n\n1. **Avaliar interface em código pela screenshot.** Meça em execução:\n   teclado, erro, estado vazio, loading.\n2. **Rodar craft num problema ainda não enunciado numa frase falseável.**\n   Produz superfície bem-executada resolvendo a coisa errada — Gate 1\n   (enquadrar) vem antes de qualquer pixel.\n3. **Confundir o modo do produto com o modo da superfície.** Um SaaS\n   Operate pode ter uma landing Persuade — craft muda por página, não por\n   produto inteiro.\n", "bytes": 3027, "sha": "f6b4833f2f49e48a", "mtime": "2026-08-16 04:57"}, {"caminho": "referencias/260810_metaprompt-patterns.md", "nome": "260810_metaprompt-patterns.md", "texto": "# Metaprompt: padrões que funcionam\n\nMetaprompt = usar o modelo para construir/refinar a instrução que o modelo vai\nexecutar. O ganho não é mágica: é que a instrução explícita substitui a\nadivinhação probabilística.\n\n---\n\n## Anatomia base — RTCRFE\n\nToda instrução séria tem seis blocos. Faltando um, o modelo preenche com o\ndefault (= slop).\n\n| Bloco | Pergunta que responde | Erro comum |\n|---|---|---|\n| **R**ole | De que ponto de vista? | Papel genérico (\"você é um assistente útil\") — não restringe nada |\n| **T**ask | Qual o verbo e o objeto? | Verbo vago (\"ajude com\") |\n| **C**ontext | O que preciso saber que não é óbvio? | Contexto demais; despejo de arquivo |\n| **R**estrictions | O que NÃO fazer? | Ausente — é o bloco mais esquecido e o mais eficaz |\n| **F**ormat | Como o output é estruturado e onde ele abre? | \"Formato livre\" |\n| **E**xamples | Como se parece o certo? | Exemplos de casos de borda em vez de canônicos |\n\n### Sobre Restrictions (espaço negativo)\nO bloco de maior retorno. O modelo colapsa para o padrão mais provável — dizer\no que evitar é a única forma de sair dele.\n\n```\nNÃO: abrir reafirmando a pergunta · usar \"não é apenas X, é Y\" ·\n     terminar com parágrafo-resumo · usar as palavras [lista] ·\n     bullets onde a relação entre itens importa · hedge empilhado\n```\n\n### Sobre Examples\n**Exemplos canônicos diversos > lista exaustiva de casos de borda.** 2–3\nexemplos que retratam o comportamento esperado batem 15 regras de exceção.\nEmpilhar edge case degrada.\n\n---\n\n## Padrão 1 — Rubrica antes da geração\n\nEscreva o critério de aprovação **antes** de gerar. Sem rubrica, a autocrítica\nvira opinião.\n\n```\nAntes de escrever, defina 3 critérios verificáveis de sucesso desta peça.\nMostre os critérios. Depois gere. Depois pontue a sua própria saída\nde 1–5 em cada critério, com a evidência (cite o trecho).\nSe algum critério < 4, reescreva só o que falhou.\n```\n\nPor que funciona: transforma \"está bom?\" (não falseável) em \"atende ao\ncritério 2?\" (falseável).\n\n---\n\n## Padrão 2 — Dois passos com reparo limitado\n\n```\nPasso 1: gere.\nPasso 2: critique contra a rubrica, apontando trechos específicos.\nPasso 3: reescreva UMA vez. Não itere além disso.\n```\n\n⚠️ **Limite de 1 é técnico, não estilístico.** Loops de auto-refinamento sem\nlimite convergem para uma média homogênea: corrigem slop léxico e introduzem\nslop estrutural. Se após 1 reparo continua ruim, o problema está no\nenquadramento.\n\n---\n\n## Padrão 3 — A versão ruim primeiro\n\nO mais barato do arquivo.\n\n```\nPrimeiro, escreva a versão óbvia e genérica que qualquer IA produziria\npara este pedido. Rotule como DESCARTAR.\nDepois escreva a versão real, que não pode compartilhar nenhuma\nfrase, estrutura ou ângulo com a descartada.\n```\n\nPor que funciona: força o modelo a *localizar* o modo default e depois se\nafastar dele, em vez de apenas ser instruído a \"ser criativo\".\n\n---\n\n## Padrão 4 — Red team / advogado do diabo\n\n```\nAssuma o papel de quem vai rejeitar este trabalho. Liste as 3 objeções\nmais fortes — não as fáceis. Depois responda a cada uma revisando a peça,\nou declare explicitamente por que a objeção é aceitável.\n```\n\nUsar em: proposta comercial, decisão de arquitetura, argumento de design,\norçamento.\n\n---\n\n## Padrão 5 — Decomposição (metaprompt escreve o brief)\n\nPara tarefa grande, separe **quem especifica** de **quem executa**.\n\n```\nFase A: NÃO execute. Escreva a especificação completa do trabalho —\n        entregável, restrições, critérios, riscos, sequência.\nFase B: [após aprovação] execute exatamente a especificação.\n```\n\nNo MEGABRAIN isto é a fase SPEC → TICKETS → IMPLEMENTAR: a spec aprovada é o\ncontrato; quem executa recebe a spec, não o histórico da conversa.\n\n---\n\n## Padrão 6 — Grau de certeza obrigatório\n\nContra o hedge empilhado.\n\n```\nMarque cada afirmação factual: [VERIFICADO] com fonte,\n[INFERIDO] com o raciocínio, ou [ESTIMATIVA] com a margem.\nNão use \"pode\", \"talvez\", \"possivelmente\" como substituto do rótulo.\n```\n\n---\n\n## Padrão 7 — Refinar um prompt existente\n\nCole o prompt ruim e rode:\n\n```\nAnalise este prompt como engenheiro de prompt.\n1. Que blocos de RTCRFE estão faltando?\n2. Que ambiguidade permite mais de uma interpretação válida?\n3. Que default indesejado o modelo vai assumir no silêncio?\n4. Reescreva. Mostre um diff do que mudou e por quê.\n```\n\n---\n\n## Padrão 8 — Ancoragem por referência, não por adjetivo\n\nAdjetivo (\"moderno\", \"profissional\", \"clean\", \"impactante\") não restringe —\ncada um significa mil coisas. Referência concreta restringe.\n\n```\n❌ \"tom profissional e moderno\"\n✅ \"tom do [exemplo colado]. Frases curtas, zero adjetivo de venda,\n    números específicos, admite o que não sabe.\"\n```\n\nVale igualmente para direção visual: referência > descrição.\n\n---\n\n## Ordem que importa\n\n1. Restrições e formato **antes** do conteúdo longo — o modelo pesa o início e\n   o fim mais que o meio.\n2. Exemplos **depois** das regras — o exemplo ilustra a regra, não a substitui.\n3. Instrução crítica **repetida no fim** de prompt longo.\n4. Uma tarefa por prompt. Duas tarefas = duas chamadas ou uma decomposição\n   explícita.\n\n---\n\n## Anti-padrões\n\n| Anti-padrão | Por quê |\n|---|---|\n| \"Seja criativo / pense fora da caixa\" | Zero restrição. Não muda a distribuição. |\n| \"Você é um especialista de classe mundial em...\" | Superlativo não adiciona capacidade. Especifique o ponto de vista real. |\n| Empilhar 20 regras de exceção | Degrada. Use 2–3 exemplos canônicos. |\n| \"Não cometa erros\" | Não acionável. |\n| Prompt-monólito de 3000 palavras | Meio do contexto perde peso. Decomponha. |\n| Pedir para \"verificar duas vezes\" sem critério | Vira teatro. Dê a rubrica. |\n| Loop de refino sem limite | Converge para mingau homogêneo. |\n", "bytes": 5923, "sha": "0d6acc9dda27f909", "mtime": "2026-08-16 04:57"}, {"caminho": "referencias/260810_metaprompt-templates.md", "nome": "260810_metaprompt-templates.md", "texto": "# Templates prontos para colar (T1–T8)\n\nPreencha `[colchetes]`. Todos testáveis em qualquer IA.\n\n---\n\n## T1 — Brief de entrega (uso geral)\n\n```\nPAPEL: [de que ponto de vista específico — não \"especialista de classe mundial\"]\nTAREFA: [verbo + objeto. Um só.]\nCONTEXTO: [só o que não é óbvio. Não despeje.]\nRESTRIÇÕES:\n- Formato: [.pptx 16:9 / .docx / markdown / código em X]\n- Tamanho: [páginas, slides, palavras, linhas]\n- Tom: [referência concreta colada, não adjetivo]\n- NÃO fazer: [lista explícita]\nCRITÉRIOS DE SUCESSO (escreva antes de gerar, mostre-os):\n1. [verificável]\n2. [verificável]\n3. [verificável]\nEXEMPLO CANÔNICO: [1–3 exemplos representativos, não casos de borda]\n\nAntes de gerar: descreva em uma linha a versão genérica que você\nproduziria por default. Rotule DESCARTAR. A versão real não pode\ncompartilhar frase, estrutura ou ângulo com ela.\nDepois de gerar: pontue-se 1–5 em cada critério com citação do trecho.\nQualquer nota < 4, reescreva só o que falhou. Uma rodada.\n```\n\n---\n\n## T2 — Refinar um prompt existente\n\n```\nAnalise este prompt como engenheiro de prompt. Não o execute.\n\n[COLE O PROMPT]\n\n1. Que blocos faltam? (papel, tarefa, contexto, restrições, formato, exemplos)\n2. Que ambiguidade permite mais de uma interpretação válida?\n3. Que default indesejado o modelo vai assumir no silêncio?\n4. Reescreva. Mostre um diff do que mudou e por quê.\n```\n\n---\n\n## T3 — Red team\n\n```\nAssuma o papel de quem vai REJEITAR este trabalho — não um crítico\neducado, quem tem motivo real para dizer não.\n\n[COLE O ARTEFATO]\n\nListe as 3 objeções mais fortes. Não as fáceis.\nPara cada uma: revise o artefato para responder, ou declare\nexplicitamente por que a objeção é aceitável e qual o custo de aceitá-la.\n```\n\n---\n\n## T4 — Verificação independente (agente separado)\n\n```\nVocê recebe um artefato e uma rubrica. Você não sabe como ele foi\nproduzido e não deve assumir boa intenção.\n\nRUBRICA:\n1. [critério]\n2. [critério]\n3. [critério]\n\nARTEFATO:\n[colar]\n\nPara cada critério: nota 1–5 + citação literal da evidência.\nNota sem citação não conta.\nDepois: as 3 objeções mais fortes de quem rejeitaria isso.\nNão sugira melhorias. Só avalie.\n```\n\n---\n\n## T5 — Decomposição (spec antes de execução)\n\n```\nFASE A — NÃO EXECUTE.\nEscreva a especificação completa deste trabalho:\n- Entregável exato e formato\n- Restrições (declaradas e inferidas)\n- Critérios de aceite verificáveis\n- Riscos e o que pode dar errado\n- Sequência de passos com dependências\n- O que está fora de escopo\n\nPare aqui. Aguarde aprovação.\n\nFASE B — [após aprovação] execute exatamente a especificação aprovada.\nSe encontrar algo que a spec não previu, pare e pergunte.\n```\n\n---\n\n## T6 — Handoff de sessão (contexto acabando)\n\n```\nEscreva um handoff para retomar este trabalho numa sessão nova.\nMáximo 40 linhas. Formato:\n\n# OBJETIVO\n[uma frase]\n# DECIDIDO\n[decisões travadas — não reabrir]\n# ABERTO\n[o que ainda precisa de decisão, e de quem]\n# DESCARTADO\n[o que foi tentado e rejeitado, com o motivo — não reciclar]\n# ESTADO DOS ARQUIVOS\n[caminhos + o que cada um contém]\n# PRÓXIMO PASSO\n[a primeira ação concreta da próxima sessão]\n```\n\n---\n\n## T7 — Brief de projeto de design\n\n```\nFASE DO DUPLO DIAMANTE: [1 Pesquisa / 2 Análise / 3 Ideação / 4 Design]\nMODO: [divergir / convergir]\n\nPROBLEMA (uma frase falseável): [se não consegue escrever, você ainda\nestá na Fase 1]\nUSUÁRIO E DECISÃO: [quem, e o que essa pessoa faz depois]\n\nRESTRIÇÕES TRAVADAS (antes de compor):\n- Grade: [colunas / margens]\n- Escala tipográfica: [máx. 5 passos]\n- Paleta: [máx. 3 famílias + neutros, com hex]\n- Espaçamento: [base, ex. 4/8]\n- Formato final: [dimensão, DPI, perfil de cor, onde é aberto]\n\nREFERÊNCIA VISUAL: [links ou descrição de peça concreta — não adjetivos]\nANTIRREFERÊNCIA: [o que evitar, com exemplo]\nFIDELIDADE: [proporcional à certeza atual]\n\nAntes de entregar, rode:\n- Print sem logo: dá pra saber de quem é?\n- Hierarquia em 3 segundos\n- Contraste WCAG AA (4.5:1 / 3:1)\n- Toda decisão visual tem motivo declarável\n- Zero itens do léxico visual banido\n```\n\n---\n\n## T8 — Registro de lição\n\n```\n## [YYMMDD] — [contexto em 4 palavras]\nGATILHO: [quando essa situação reaparece]\nLIÇÃO: [o que deu errado ou foi descoberto]\nATALHO: [o que fazer direto da próxima vez]\n```\n\nRegistre só o que muda ação futura. Narrativa de sessão não entra.\nDestino: `licoes-megabrain.md` da fonte canônica do MEGABRAIN.\n", "bytes": 4563, "sha": "c6873352a6f31b5b", "mtime": "2026-08-16 04:57"}, {"caminho": "referencias/260810_sync-memoria.md", "nome": "260810_sync-memoria.md", "texto": "# Sincronizar identidade entre agentes (Claude Code, Kimi CLI, Gemini CLI)\n\nExtensão do Gate 0 (assumir) — não confundir com o Gate 0/6 de **estado de\nprojeto** (`ESTADO.md`/`HANDOFF.md`). Isto sincroniza **quem é a pessoa e\ncomo ela quer resposta** — perfil, preferências, formato obrigatório — não\no que o projeto está fazendo agora.\n\nRode isto ao configurar um agente novo num projeto, ou sempre que o\narquivo de identidade mudar.\n\n## Por que isto existe\n\nUm arquivo de identidade por pessoa (nome, contexto, formato obrigatório de\nresposta, preferências fixas) é a **fonte única**. Cada agente lê memória\nde um jeito diferente — arquivo diferente, mecanismo diferente. Sem este\ngate a informação diverge entre eles silenciosamente: já aconteceu de duas\ncópias do mesmo texto ficarem em lugares diferentes, uma desatualizada em\nrelação à outra, sem ninguém perceber até comparar as duas.\n\n**Regra dura: nunca edite a cópia sincronizada.** Edite sempre o arquivo\nde identidade fonte e rode a sincronização de novo. Editar a cópia é o\nmesmo erro de reescrever `DECISOES.md` — perde a fonte de verdade.\n\n**Este arquivo de identidade nunca vai pro repositório público do\nprotocolo.** É dado pessoal de quem opera, não conteúdo de pipeline —\nfica local, ou num repo privado do próprio projeto.\n\n## Global (uma vez) vs. por projeto (repetido)\n\nOs três agentes suportam um arquivo de memória **global**, no diretório do\nusuário, que carrega em toda sessão, de qualquer projeto — configure uma\nvez, nunca mais repita por projeto:\n\n| Agente | Arquivo global | Arquivo por projeto (sobrepõe o global) |\n|---|---|---|\n| Claude Code | `~/.claude/CLAUDE.md` | `CLAUDE.md` na raiz do projeto |\n| Gemini CLI | `~/.gemini/GEMINI.md` | `GEMINI.md` na raiz do projeto |\n| Kimi CLI / Kimi Code | `~/.kimi/AGENTS.md` | `AGENTS.md` (ou `./.kimi/AGENTS.md`) na raiz do projeto |\n\nIdentidade (nome, preferências, formato obrigatório de resposta) é a\nmesma em todo lugar → use o **global**. Regra que só vale num projeto\nespecífico → arquivo por projeto (ele tem prioridade sobre o global).\n\n## Campo `USUARIO:` — diferenciação de perfil\n\nO arquivo de identidade pode começar com uma linha `USUARIO: Nome` logo\napós o aviso de arquivo local. Exemplo:\n\n```\nUSUARIO: <USUARIO> (<USUARIO>)\n\n## <USUARIO> (<USUARIO>) — perfil operacional\n...\n```\n\nEsse valor é propagado automaticamente para `CLAUDE.md`, `GEMINI.md` e\n`AGENTS.md` quando você usa `mb-sync-memoria.py`. Se quiser forçar outro\nnome (útil para testar outro perfil ou quando o arquivo fonte ainda não\ntem o campo), use `--usuario \"Nome\"`.\n\nNo `HANDOFF.md` do projeto, `mb-sync.py lock` também grava o campo\n`USUARIO:` — detectado do arquivo de identidade ou passado via\n`--usuario`. Isso deixa claro para qual pessoa a trava está ativa,\najudando em ambientes onde mais de uma pessoa pode operar o megabrain.\n\n## O que você precisa fazer, dependendo de quem você é\n\nOs três agentes resolvem import com a mesma sintaxe — `@caminho/arquivo.md`\n— seja no arquivo global ou no de projeto. Isso lê o arquivo de destino em\ntempo real, sem duplicar texto: mudou a fonte, mudou em todo lugar sem\nrodar nada de novo.\n\n1. Abra (ou crie) o arquivo global do seu agente (tabela acima).\n2. Garanta que contenha a linha: `@<caminho-completo-do-arquivo-de-identidade>`\n3. Se a linha já existir, não faça nada — já está sincronizado por\n   definição (é referência, não cópia).\n\n**Cuidado com espaço no caminho.** `@` costuma parsear até o próximo\nespaço em branco — se a pasta do arquivo de identidade tem espaço no nome\n(comum em pasta pessoal tipo \"Meus Documentos\" ou nome com espaço duplo),\no import pode cortar o caminho no meio e falhar silenciosamente. Nesse\ncaso use o modo conteúdo abaixo em vez de import — ele não depende de\npath parsing nenhum.\n\n### Alternativa sem @import: modo conteúdo (recomendado se o caminho tem espaço)\n\n`bin/mb-sync-memoria.py --source <identidade> --target all --modo\nconteudo --dir <pasta>` injeta o CONTEÚDO do arquivo de identidade dentro\nde `CLAUDE.md`/`GEMINI.md`/`AGENTS.md`, entre marcadores\n(`<!-- MEGABRAIN:AUTO-SYNC:START/END -->`) — idempotente, atualiza sem\nduplicar, funciona pros três agentes, sem depender de sintaxe de import.\n`--dir \"%USERPROFILE%\"` (Windows) ou `--dir ~` (Linux/Mac) instala global.\n\nPra instalar só num agente: troque `--target all` por `--target\nclaude|gemini|kimi`.\n\n## Depois de sincronizar\n\nConfirme visualmente que o arquivo de destino reflete o conteúdo atual da\nfonte — não assuma que o script/import funcionou. Isso é o próprio Gate 5\n(verificar) aplicado aqui.\n\n## Quando rodar isto de novo\n\n- Sempre que o arquivo de identidade mudar.\n- Ao configurar um agente novo neste projeto pela primeira vez.\n- Se a pessoa pedir \"sincroniza minha identidade\" ou equivalente.\n- Se notar qualquer divergência entre o que está sincronizado e a fonte —\n  pare o que está fazendo e sincronize antes de continuar.\n", "bytes": 5033, "sha": "696e321a623b9a2d", "mtime": "2026-08-16 04:57"}, {"caminho": "referencias/260810_workflow-architecture.md", "nome": "260810_workflow-architecture.md", "texto": "# Arquitetura de workflow: onde colocar cada coisa\n\nPrimitivas de customização de um agente. Escolher errado é a causa nº1 de\n\"o agente não seguiu minha regra\".\n\n---\n\n## Tabela de decisão\n\n| Primitiva | Carregamento | Custo | Garantia | Use para |\n|---|---|---|---|---|\n| **System prompt / instruções fixas** | Toda sessão, sempre | Alto (permanente) | ❌ pedido | Preferências pessoais, convenções invioláveis, tom |\n| **Skill** (`/nome`) | Sob demanda ou por gatilho | ~zero quando inativa | ❌ pedido | Procedimento repetível, conhecimento de domínio |\n| **Agente separado** | Invocado | Contexto isolado | ❌ pedido | Trabalho barulhento, verificação independente |\n| **Script / hook / .cmd** | Evento ou execução direta | Baixo | ✅ **determinístico** | Formatação, lint, backup, validação obrigatória |\n\n### A regra que resolve 80% da frustração\n**Instrução em markdown é pedido, não garantia.** O modelo pode não seguir.\nSe algo *precisa* acontecer sempre e sem falha — rodar prettier, versionar com\ndata, bloquear deploy — isso é script, nunca instrução em markdown.\n\nCorolário no MEGABRAIN: os portões de publicação vivem em `.cmd` (script que\nroda os portões sozinho e pausa antes do irreversível), não numa skill que\npede \"lembre de validar\".\n\n---\n\n## System prompt — o que entra\n\n✅ Entra:\n- Preferências de resposta (TL;DR primeiro, tom, idioma)\n- Convenções de arquivo/versionamento\n- Stack e ferramentas fixas\n- O que **nunca** fazer\n- Um ponteiro curto para o protocolo (não o protocolo inteiro)\n\n❌ Não entra:\n- Procedimento longo → vira skill\n- Conhecimento de domínio → vira arquivo de referência\n- Qualquer coisa relevante em menos de 30% das sessões\n- Documentação → vira README\n\n**Teste:** essa linha vale a pena ser lida em *toda* conversa, inclusive nas\ntriviais? Não? Fora.\n\n---\n\n## Skills — como escrever uma que funciona\n\n### Frontmatter\n```yaml\n---\nname: kebab-case-max-64-chars\ndescription: O que faz E quando usar. Máx 1024 chars. Sem tags XML.\n---\n```\n\nA `description` é o **único** texto que o modelo vê antes de decidir disparar.\nEla precisa conter os gatilhos literais: as palavras que a pessoa realmente\ndigita.\n\n- ❌ `description: Ajuda com design.`\n- ✅ `description: Roda o protocolo de projeto de design (Duplo Diamante).\n  Use quando a pessoa digitar /design-diamond, iniciar projeto visual novo,\n  perguntar \"onde estamos\" num projeto, ou pedir para definir o próximo passo.`\n\n### Corpo\n- Máx. ~500 linhas. Passou disso, fatie em `references/` e aponte.\n- Um caminho feliz claro.\n- **Seção obrigatória: \"Como isso costuma dar errado\".** Isso vale mais para\n  confiabilidade que todas as instruções do caminho feliz. Liste os modos de\n  falha reais que você já viu.\n- Tabelas > prosa para roteamento.\n\n### Estrutura de pasta\n```\nminha-skill/\n  SKILL.md          # nível 2 — carregado ao disparar\n  references/*.md   # nível 3 — carregado sob demanda\n  templates/*       # colável\n  scripts/*         # executável (garantia real)\n```\n\n---\n\n## Agentes separados\n\n**Específico bate genérico.** Especificidade compra seleção de ferramenta\nmelhor e contexto mais apertado.\n\n- ❌ \"agente de QA\"\n- ✅ \"auditar contraste WCAG AA nas 6 telas exportadas em /export e devolver\n  só as falhas com valores\"\n\nNão delegue: decisão que depende do histórico da conversa · trabalho criativo\nque precisa do contexto acumulado · qualquer coisa que o agente teria que\nredescobrir do zero (o start a frio é o custo real).\n\n---\n\n## Fluxo padrão para tarefa não-trivial\n\n```\n1. Enquadrar        → Gate 1 (referencias/gates-entrega.md)\n2. Planejar         → spec ANTES de editar/gerar\n3. Delegar ruído    → agente separado\n4. Executar         → skill de formato\n5. Auditar          → Gate 4 anti-slop\n6. Verificar        → abre? números batem? caminhos existem?\n7. Registrar        → licoes-megabrain.md\n```\n\nEtapa 2 é a mais pulada e a mais cara de pular.\n\n---\n\n## Quando promover uma lição a skill/regra\n\nGatilho: **a mesma lição apareceu 3 vezes.**\n\n```\n1× → nota em licoes-megabrain.md\n2× → nota + tag de recorrência\n3× → vire regra do PIPELINE.md ou skill própria, e limpe as notas\n```\n\nLição que se repete não é memória — é processo não escrito.\n\n---\n\n## Como isso costuma dar errado\n\n1. **Colocar procedimento no system prompt.** Ele fica longo, o modelo ignora\n   o meio, e você paga o custo em toda sessão.\n2. **Description de skill vaga.** A skill nunca dispara e você culpa o modelo.\n3. **Esperar garantia de markdown.** Se é crítico, é script.\n4. **Agente genérico.** Entra frio, sai raso.\n5. **Skill sem \"como dá errado\".** Funciona na demo, quebra no uso real.\n6. **Skills demais com escopo sobreposto.** O modelo não sabe qual disparar.\n   Funde ou delimita.\n", "bytes": 4850, "sha": "193e5a049a1e4871", "mtime": "2026-08-16 04:57"}, {"caminho": "referencias/260811_kimi-handoff.md", "nome": "260811_kimi-handoff.md", "texto": "# Quando a tarefa bate numa parede do sandbox: empacotar pro Kimi\n\nO Cowork/Claude roda dentro de um sandbox com acesso só ao que foi\nexplicitamente conectado — não à pasta home, não a caminho fora do que o\n<USUARIO> escolheu, e algumas pastas conectadas bloqueiam delete/rename por\npolítica (erro \"Operation not permitted\" em vez de recusa educada). O Kimi\nCLI roda **local, sem sandbox**: enxerga o disco inteiro com a permissão da\nconta do <USUARIO>. Quando a tarefa exige isso, a resposta certa não é dizer\n\"não consigo\" — é empacotar a tarefa pro Kimi resolver.\n\n## Quando rotear pra cá\n\n- `request_cowork_directory` devolve erro tipo \"Cannot mount the home\n  directory itself\" ou similar.\n- O caminho que a tarefa precisa está fora de qualquer pasta já conectada\n  nesta sessão, e conectar mais uma pasta não resolve (ex.: a tarefa precisa\n  de várias pastas espalhadas, ou de uma ação em nível de sistema).\n- Delete/rename falha com erro de permissão mesmo depois de\n  `allow_cowork_file_delete` (a política vale por pasta conectada, não por\n  todo o disco).\n- Ação de sistema operacional: instalar programa, mexer em variável de\n  ambiente, editar registro, matar processo, reiniciar serviço.\n\nNão rotear pra cá só porque é mais rápido — se a pasta já está conectada e\na ferramenta de arquivo já resolve, usa ela. Isso aqui é fallback de\nalcance, não atalho de preguiça.\n\n## O que entregar\n\nNunca \"manda pro Kimi resolver\" solto. Monta um bloco de texto **pronto pra\ncolar**, autocontido, sem depender de contexto que só existe nesta\nconversa:\n\n1. **Objetivo em uma frase** — o que precisa estar verdadeiro no final.\n2. **Caminhos absolutos reais** — nunca \"a pasta de lições\", sempre\n   `<MEGABRAIN_ROOT>\\licoes-megabrain.md` por extenso.\n   Se o caminho tem espaço duplo ou caractere estranho (ex.: `MEGA B R A I  N`),\n   copiar literal, nunca redigitar de memória.\n3. **Estado atual verificado** — o que já foi confirmado nesta sessão\n   (conteúdo, tamanho, última entrada) pra o Kimi não repetir diagnóstico.\n4. **Ação exata** — comando ou passo a passo, não \"sincronize os dois\n   arquivos\" vago.\n5. **Como verificar que deu certo** — o que o Kimi (ou o <USUARIO>) deve\n   conferir depois, e o que colar de volta pra confirmar.\n\nFormato do bloco: título curto + corpo em markdown dentro de um bloco de\ncódigo, pra ele copiar de uma vez.\n\n## Depois que ele rodar no Kimi\n\nSe o <USUARIO> colar o resultado de volta nesta conversa, audita como\nqualquer output de outro agente (Gate 4 do protocolo principal): confere se\nbateu com o esperado, não assume que rodou limpo só porque ele disse que\nrodou. Se a lição/decisão que motivou o handoff merece registro, registra\nem `licoes-megabrain.md` — o Kimi ter executado não substitui o registro\ndaqui.\n\n## Como isso costuma dar errado\n\n1. **Empacotar vago.** \"Peça pro Kimi arrumar aquilo\" sem caminho absoluto\n   nem estado atual obriga o Kimi a redescobrir tudo — perde exatamente o\n   trabalho de diagnóstico que já foi feito aqui.\n2. **Rotear cedo demais.** Tarefa que a pasta já conectada resolveria virar\n   handoff desnecessário — sempre tentar primeiro com o que está conectado.\n3. **Não verificar depois.** Aceitar \"rodei no Kimi\" sem conferir o\n   resultado quebra o mesmo princípio que vale pra qualquer entrega de outro\n   agente: output alheio é rascunho até auditado.\n", "bytes": 3428, "sha": "4c06a5c458338407", "mtime": "2026-08-16 04:57"}, {"caminho": "referencias/260813_aspirador-codigo.md", "nome": "260813_aspirador-codigo.md", "texto": "# 260813 — Aspirador de código do megabrain\n\nFerramenta: `bin/mb-aspirador.py`.\n\nFunção: varrer um diretório de código e apontar sujeira mecânica segura —\nespaços no fim de linha, linhas em branco excessivas, tabs misturados com\nespaços, quebras de linha mistas e imports não usados (Python).\n\n## Princípio não destrutivo\n\n- **Dry-run por padrão.** Sem `--aplicar`, o script só lê e relata.\n- **Backup obrigatório.** Com `--aplicar`, o arquivo original é copiado para\n  `.mb-aspirador/backups/<timestamp>/` antes de qualquer alteração.\n- **Nunca apaga arquivos.** Arquivos vazios ou binários são reportados, não\n  removidos.\n- **Nunca muda lógica, nomes ou comentários.** Apenas ajustes mecânicos.\n\n## Uso\n\n```bash\npython bin/mb-aspirador.py --dir ./meu-projeto\npython bin/mb-aspirador.py --dir ./meu-projeto --aplicar\npython bin/mb-aspirador.py --dir ./meu-projeto --ext py,js,ts\n```\n\n## O que detecta\n\n| Tipo | Descrição | Corrige? |\n|---|---|---|\n| `trailing-whitespace` | espaços no final da linha | sim |\n| `linhas-branco-fim` | mais de uma linha vazia no final do arquivo | sim |\n| `tabs-mistos` | tab em arquivo que já usa espaços | sim |\n| `quebra-mista` | CRLF e LF misturados | sim |\n| `import-nao-usado` | import Python não referenciado | não (reportar e revisar) |\n| `syntax-error` | arquivo Python com erro de sintaxe | não (revisar manualmente) |\n| `nao-texto` | arquivo binário | não |\n\n## Saída\n\n- Markdown: `.mb-aspirador/relatorio-YYYYMMDD-HHMMSS.md`\n- HTML: `.mb-aspirador/relatorio-YYYYMMDD-HHMMSS.html`\n\nO HTML é autocontido (CSS inline), traz metadados para IA (`<meta>` e JSON-LD),\nresumo em cards, tabela de arquivos, snippets com a linha problemática\ndestacada, documentação da ferramenta embutida e anexa notas locais `.md`/`.txt`\nencontradas em `.mb-aspirador/` (exceto env files, relatórios antigos e\narquivos maiores que 100 KB). A documentação do projeto vive no relatório DNA,\nnão no relatório do aspirador.\n", "bytes": 1988, "sha": "60f0d0ad23aabbeb", "mtime": "2026-08-16 04:57"}, {"caminho": "referencias/260813_multi-ia.md", "nome": "260813_multi-ia.md", "texto": "# Guia multi-IA — qual modelo usar para quê\n\nGuia genérico para escolher entre IAs de código em tarefas de desenvolvimento,\ndesign e documentação. Não prende a um projeto específico.\n\n## Divisão por tipo de trabalho\n\n| Tarefa | Agente indicado | Por quê |\n|---|---|---|\n| Varredura, extração, leitura longa | Contexto grande / custo baixo | Economiza token do agente de julgamento |\n| Refactor mecânico, boilerplate | Contexto grande / custo baixo | Trabalho repetitivo, pouca decisão |\n| Enquadramento, decisão de design | Julgamento / síntese | Define direção antes de gastar código |\n| Auditoria anti-slop, texto final | Julgamento / síntese | Requer leitura crítica e gosto |\n| Handoff multi-agente (Claude↔Kimi) | Ambos, com trava | Um prepara, outro revisa; trava evita conflito |\n| Fallback (quando um falha) | Terceiro agente | Sem papel fixo; assume o gate do substituído |\n\n## Escolha por modelo\n\n| Modelo | Melhor uso | Evitar |\n|---|---|---|\n| Claude (Opus/Sonnet) | Julgamento, síntese, auditoria, decisão de design | Varredura longa em repo grande |\n| Kimi (K2) | Contexto longo, extração, primeira passada | Entrega final sem revisão do Claude |\n| GPT-5.6 Sol | Capacidade de fronteira: arquitetura difícil, decisão de design, auditoria final e trabalho profissional complexo | Varredura ou transformação mecânica em volume quando custo/latência importam |\n| GPT-5.6 Terra | Equilíbrio entre inteligência e custo: implementação cotidiana, revisão de código e síntese com julgamento moderado | Usar como máximo automático sem medir ganho sobre Terra/Luna |\n| GPT-5.6 Luna | Alto volume sensível a custo: busca, extração, classificação, boilerplate e primeira passada | Decisão final de alto risco sem revisão por Terra/Sol |\n| GPT-5.5 | Compatibilidade com fluxos já calibrados; segunda opinião em tarefa profissional complexa | Escolha nova por padrão quando a família 5.6 estiver disponível e testada |\n| GPT-5.4 | Trabalho cotidiano com custo menor e comportamento já conhecido | Arquitetura ou auditoria mais difícil se 5.6 estiver disponível |\n| GPT-5.4 Mini | Subtarefas focadas, agentes auxiliares, triagem e transformação simples em volume | Síntese final, ambiguidade alta ou mudanças amplas no repositório |\n| Gemini | Fallback opcional, multimodal | Não é membro fixo; usar só quando os outros falham |\n\n### Esforço de raciocínio na família GPT-5.6\n\n| Nível | Usar em | Exemplo MEGABRAIN |\n|---|---|---|\n| `low` | Latência e volume | localizar arquivos, extrair decisões, formatar dados |\n| `medium` | Ponto de partida recomendado | implementar mudança delimitada e rodar testes |\n| `high` / `xhigh` | Ambiguidade ou risco com ganho de qualidade mensurável | arquitetura, debugging difícil, revisão de migração |\n| `max` | Casos mais difíceis em que qualidade domina custo e tempo | auditoria final de mudança crítica ou plano com risco de perda de dados |\n\nNão usar `max` como padrão. Comparar primeiro `medium`, depois `high`/`xhigh`;\nreservar `max` quando a rubrica mostrar ganho. Sol, Terra e Luna compartilham a\nmesma janela nominal de contexto na API; a diferença principal é capacidade,\ncusto e volume, não o tamanho do arquivo que cada um consegue receber.\n\n## Regra prática\n\n1. **Comece pelo custo eficiente** (Kimi ou GPT-5.6 Luna) se a tarefa é ler,\n   extrair ou transformar muito texto/código.\n2. **Passe para o julgamento** (Claude, GPT-5.6 Terra ou Sol) quando precisar\n   decidir, auditar, escrever texto final ou fechar design.\n3. **Use fallback** (Gemini, outro) quando um agente trava, ou quando precisa\n   de segunda opinião sem viés do primeiro.\n4. **Handoff sempre com trava** (`TRAVADO_POR`) e arquivos de estado\n   (`ESTADO.md`, `HANDOFF.md`, `DECISOES.md`).\n\n## Como isso costuma dar errado\n\n- Usar o agente de contexto grande para decidir: produz slop rápido.\n- Usar o agente de julgamento para varredura: queima contexto caro.\n- Handoff sem trava: merge conflict ou trabalho duplicado.\n- Fallback sem instrução clara: o terceiro agente não sabe qual gate seguir.\n- Confundir janela de contexto com qualidade de julgamento: caber no prompt não\n  significa decidir bem.\n- Selecionar `max` por reflexo: aumenta latência e custo sem ganho garantido.\n\n## Fonte da família GPT-5.6\n\nRoteamento baseado na documentação oficial da OpenAI consultada em 2026-08-14:\n`https://developers.openai.com/api/docs/guides/latest-model` e\n`https://developers.openai.com/api/docs/models/compare`. Revalidar antes de\nalterar preços, limites, aliases ou disponibilidade.\n\n## Versão integrada\n\nEste guia é a versão multi-IA do megabrain. Ele é opcional e pode ser lido\njunto com `MEGABRAIN.md` seção 9 (roteamento de arquitetura), ou separado\nquando o projeto só precisa do protocolo base.\n", "bytes": 4827, "sha": "ff0439ee24a58f80", "mtime": "2026-08-16 04:57"}, {"caminho": "referencias/260815_pipeline-governanca-aprendizado.md", "nome": "260815_pipeline-governanca-aprendizado.md", "texto": "# Pipeline de governança e aprendizado entre projetos\n\nCarregue esta referência quando um projeto operar com cliente, dinheiro, aprovações humanas, múltiplas IAs ou quando o usuário exigir que seus aprendizados retroalimentem o MEGABRAIN.\n\n## 1. Princípio central\n\nAutomação prepara, mede e recomenda. A pessoa responsável decide, autoriza comunicações externas, aprova preço/escopo e responde pelo resultado. O objetivo é reduzir repetição sem terceirizar responsabilidade.\n\n## 2. Papéis separados\n\n| Papel | Responsabilidade | Não pode |\n|---|---|---|\n| Diretor humano | Decide, aprova, envia e assume compromisso. | Ser substituído por consenso de modelos. |\n| Agente principal | Integra contexto, propõe plano e entrega resultado. | Esconder dúvida material ou inventar decisão humana. |\n| Amarrador de Pontas | Detecta dúvidas, números velhos, prazos, dependências e decisões sem dono. | Transformar toda ambiguidade em pergunta ao usuário. |\n| Contraditor | Ataca premissas, riscos e custo do erro; propõe teste. | Criticar sem saída ou decidir por maioria. |\n| Teammate | Executa subproblema delimitado com rubrica. | Expandir o escopo ou enviar algo externamente. |\n| Verificador | Confere fatos, cálculo, teste e rastreabilidade. | Aprovar o próprio trabalho sem evidência. |\n\n## 3. Amarrador de Pontas\n\nRoda antes de aprovação humana, envio externo, fechamento semanal e handoff. Lê estado, handoff, decisões, lições, tracker e fontes declaradas.\n\nSaída mínima: ID, tema, pergunta, evidência, impacto, recomendação, dono, prazo e estado.\n\nRegras:\n\n- descobrir sozinho tudo que for leitura segura;\n- mostrar ao usuário no máximo cinco perguntas prioritárias;\n- priorizar caixa, cliente, privacidade, prazo e bloqueio real;\n- agrupar perguntas próximas;\n- não inventar preço, imposto, disponibilidade, gosto ou credencial;\n- reapareceu três vezes: o Contraditor avalia falha do processo e propõe regra, checklist, template ou automação.\n\n## 4. Contraditor\n\nUma rodada de crítica deve produzir: premissa atacada, evidência disponível, três objeções no máximo, impacto, teste barato e recomendação. Risco financeiro, legal, de segurança ou promessa sem prova pode bloquear. Preferência sem evidência não bloqueia.\n\nO Contraditor pode convocar Teammates ou outros modelos, mas recebe uma tarefa delimitada. O agente principal integra e o diretor humano decide.\n\n## 5. Teammates e modelos por custo\n\nUse o recurso mais barato capaz de passar na rubrica:\n\n0. script/busca determinística;\n1. modelo local ou econômico para extração, classificação e rascunho;\n2. modelo leve para varredura longa e alternativas;\n3. modelo intermediário para implementação e síntese;\n4. modelo forte para arquitetura, risco alto e auditoria crítica.\n\nEscalar só depois de falha observada, ambiguidade relevante ou alto custo do erro. Registrar tarefa, nível, motivo, resultado, custo/tempo e se escalou. Não presumir preço ou disponibilidade permanente de fornecedor; recalibrar pela conta real.\n\n## 6. Portões humanos e caixa\n\nProjetos comerciais devem declarar portões antes de:\n\n- contato ou pesquisa nominal invasiva;\n- proposta, preço, desconto, escopo ou prazo;\n- início sem pagamento/escrow financiado;\n- apresentação ao cliente;\n- entrega/publicação;\n- uso externo de dado, ativo, credencial ou comunicação.\n\nAceite, contrato e escrow sem data de liberação não são caixa. Tracker comercial é atualizado antes de novo contato ou follow-up. IA prepara; humano revisa e envia. Nada de bot, scraping ou disparo automatizado sem regra específica e autorização.\n\n## 7. Gate financeiro para serviços\n\nPreço deve separar remuneração do trabalho, custo direto, reserva de retrabalho, taxa do canal, reserva fiscal/compliance, custo fixo alocado e lucro. “Margem” sem dizer o que foi descontado é inválida.\n\nAntes da proposta:\n\n1. definir remuneração interna do trabalho e capacidade faturável mensal;\n2. ratear custo fixo por hora faturável ou outra base causal declarada;\n3. somar horas, retrabalho, custo direto e fixo alocado para obter o custo completo;\n4. calcular o piso depois de reserva fiscal, taxa do canal e margem desejada;\n5. verificar condição de pagamento e data provável do caixa;\n6. abaixo da margem-alvo, reduzir escopo, elevar preço ou recusar;\n7. desconto, urgência e revisão extra exigem recálculo e alçada explícita.\n\nValidar em dois níveis: cada ticket precisa ficar acima de seu piso completo e o portfólio mensal precisa pagar todos os fixos uma única vez. O rateio não substitui o teste do mês.\n\nRodar ao menos dois estresses antes de publicar preço: desconto comercial e estouro de horas. Se qualquer um derrubar a margem, registrar o ponto de parada e a ação corretiva na proposta.\n\nProjetar receita anualizada contra o limite do regime tributário, somando todas as receitas do mesmo negócio, não apenas a nova oferta. Depois da entrega, registrar horas e margem reais. Recalibrar após três trabalhos comparáveis ou 30 dias.\n\n## 8. Dinheiro e momentum\n\nProjetos que também servem para recuperar ritmo produtivo devem ter dois placares:\n\n- **econômico:** recebido, margem, horas, pipeline e cobertura do custo fixo;\n- **momentum:** blocos focados concluídos, próximas ações encerradas, ciclos completos e ativos reutilizáveis validados.\n\nAtividade sem comprador, prova, decisão ou ganho de capacidade não pode virar substituto confortável da venda/entrega. Cada projeto define um teto para trabalho indireto e uma próxima ação com verbo, dono e prazo.\n\n## 9. Dogfooding com sanitização\n\nUsar produtos próprios em trabalho real é permitido quando o cliente entende o processo e a segurança é proporcional ao risco. Registrar atrito, versão, aprovação, tempo e incidente no projeto correspondente. Só promover padrão sanitizado: sem nome, credencial, arquivo ou informação estratégica do cliente.\n\nIncidente de acesso, privacidade, perda de dados ou indisponibilidade pausa novas entradas até triagem humana.\n\n## 10. Promoção para o MEGABRAIN\n\nAo fechar sessão ou ciclo:\n\n1. registrar a lição específica no projeto;\n2. perguntar: seria útil num projeto completamente diferente?;\n3. se sim, criar uma versão sanitizada na fonte central do MEGABRAIN;\n4. apontar de onde veio, sem carregar dado do cliente;\n5. três repetições transformam a lição em regra, skill, template ou script;\n6. sincronizar/exportar conforme o protocolo central e registrar o que ainda não foi publicado.\n\nSe o usuário disser explicitamente que uma classe de mecânica deve “sempre ir ao MEGABRAIN”, a promoção sanitizada ocorre no mesmo ciclo; não fica apenas como candidata em handoff.\n\n## 11. Checklist mínimo de fechamento\n\n- [ ] portões humanos respeitados;\n- [ ] caixa separado de aceite/escrow;\n- [ ] margem e horas reais registradas;\n- [ ] cinco pontas prioritárias ou menos;\n- [ ] Contraditor usado onde risco justificava;\n- [ ] Teammates registrados pelo custo real;\n- [ ] aprendizado sanitizado promovido ou justificado como específico;\n- [ ] próxima ação com verbo, dono e prazo.\n", "bytes": 7163, "sha": "0238044f1af011f1", "mtime": "2026-08-16 04:57"}, {"caminho": "skills/codex-megabrain/SKILL.md", "nome": "SKILL.md", "texto": "---\nname: codex-megabrain\ndescription: Executa o protocolo MEGABRAIN no Codex com estado multi-IA, trava de arquivos, planejamento proporcional, auditoria anti-slop, verificação e handoff. Use quando o usuário citar \"megabrain\", pedir modo completo/otimizado, iniciar ou retomar projeto complexo, solicitar entrega de design/código/documento, pedir revisão rigorosa, ou coordenar Codex com Claude, Kimi ou outro agente.\n---\n\n# Codex MEGABRAIN\n\nAplicar o MEGABRAIN como camada operacional do Codex. Manter a fonte central\ncomo autoridade; não duplicar o protocolo inteiro nesta skill.\n\n## Resolver a fonte\n\nLocalizar `<MEGABRAIN_ROOT>` nesta ordem:\n\n1. pasta `MEGABRAIN/` do projeto atual, se existir e estiver sincronizada;\n2. variável `MEGABRAIN_CENTRAL`;\n3. ancestral ou workspace que contenha `VERSAO.txt`, `MEGABRAIN.md`,\n   `bin/mb-check-version.py` e `referencias/`.\n\nSe houver uma única fonte válida, informe o caminho e use-o como\n`<MEGABRAIN_ROOT>` na sessão. Se houver mais de uma, liste as opções e peça\npara o usuário escolher. Se não encontrar nenhuma, pergunte: **“Em qual pasta\ndeste computador você salvou o MEGABRAIN? Cole o caminho da pasta raiz.”**\nValide os quatro itens antes de prosseguir. Se o usuário ainda não o instalou,\npergunte onde quer salvá-lo e conduza a instalação com caminhos relativos ao\nlocal escolhido.\n\nNão gravar caminho pessoal absoluto em `SKILL.md`. Se o projeto estiver mais\nnovo que a central, parar antes de sobrescrever e pedir direção.\n\n## Calibrar a execução\n\n- Pergunta rápida ou conversa: responder diretamente; não representar os gates.\n- Explicação, revisão ou diagnóstico: inspecionar e relatar; não implementar sem\n  pedido de mudança.\n- Pedido de criar, alterar ou corrigir: executar mudanças locais reversíveis e\n  validar sem pedir confirmação intermediária.\n- Escrita externa, publicação, push, compra, exclusão material ou ampliação de\n  escopo: obter autorização específica.\n\n## 0. Assumir o trabalho\n\nAntes de editar um projeto:\n\n1. Ler `ESTADO.md`, `HANDOFF.md`, a cauda de `DECISOES.md` e as lições\n   relevantes. Não varrer o repositório inteiro primeiro.\n2. Verificar alterações existentes e preservá-las.\n3. Consultar a trava:\n\n   ```text\n   python <MEGABRAIN_ROOT>/bin/mb-sync.py --dir <projeto> status\n   ```\n\n4. Se estiver livre, travar somente os caminhos necessários com\n   `--agente Codex`. Não tomar trava válida de outro agente.\n5. Em projeto derivado, executar `mb-check-version.py --projeto <projeto>`.\n   Central mais nova pode sincronizar; projeto mais novo exige decisão do\n   usuário antes de subir para a central.\n6. Fazer pull somente quando houver repositório, árvore segura para integração\n   e escopo autorizado. Pull não é pré-condição cega.\n\n## 1. Enquadrar\n\nDefinir internamente antes de produzir:\n\n- artefato final e aplicativo de destino;\n- leitor e decisão que ele tomará;\n- três critérios verificáveis de aprovação;\n- restrições duras;\n- contraexemplo genérico que deve ser evitado.\n\nPerguntar apenas quando uma ambiguidade muda materialmente a solução. Para\ndesign, ler `<MEGABRAIN_ROOT>/referencias/260810_design-projects.md`; se a\nentrega virar interface em código, ler também\n`260810_impeccable-routing.md`.\n\n## 2. Planejar e orçar contexto\n\n- Usar plano quando houver três ou mais etapas dependentes ou múltiplos\n  arquivos; manter exatamente uma etapa em andamento.\n- Buscar nomes e trechos antes de abrir arquivos grandes.\n- Carregar referências sob demanda, conforme a tabela da skill central em\n  `<MEGABRAIN_ROOT>/skills/megabrain/SKILL.md`.\n- Registrar checkpoint em arquivo quando a tarefa atravessar sessões.\n- Delegar somente quando o usuário ou as instruções ativas autorizarem trabalho\n  multiagente; dividir apenas subtarefas independentes e limitadas.\n- Para escolher modelo, ler\n  `<MEGABRAIN_ROOT>/referencias/260813_multi-ia.md`.\n\n## 3. Executar\n\n- Estruturar antes de preencher.\n- Preferir a ferramenta e a linguagem já adotadas pelo projeto.\n- Não introduzir stack nova sem recomendação registrada e benefício verificável.\n- Colocar procedimento repetível em skill, garantia em script/hook, estado em\n  arquivos de handoff e conhecimento pesado em referência.\n- Pesquisar fatos atuais antes de afirmá-los; marcar estimativas.\n- Em diagnóstico técnico, usar o formato pessoal ativo do usuário.\n\n## 4. Auditar e reparar uma vez\n\nLer `<MEGABRAIN_ROOT>/referencias/260810_anti-slop.md` para texto, copy ou\npeça final. Verificar:\n\n- especificidade, evidência e trade-offs;\n- repetição, frases vazias e estrutura automática;\n- substituição de marca: se serve igual ao concorrente, especificar;\n- compressão: cortar cerca de 30% quando nada essencial se perde;\n- em visual, hierarquia, contraste e decisões motivadas.\n\nFazer uma rodada de reparo. Se ainda falhar, voltar ao enquadramento em vez de\npolir indefinidamente.\n\n## 5. Verificar\n\n- Abrir o artefato no destino real quando possível.\n- Rodar testes proporcionais ao risco e conferir caminhos, datas e cálculos.\n- Comparar com `DECISOES.md` e não declarar sucesso com validação parcial.\n- Para protocolo ou skill, validar o arquivo efetivamente carregado, não apenas\n  a cópia do repositório.\n- Validar esta skill com o `quick_validate.py` do criador de skills do Codex.\n\n## 6. Passar o bastão\n\nAo concluir tarefa não trivial:\n\n1. atualizar `ESTADO.md` de forma curta;\n2. atualizar `HANDOFF.md` com feito, aberto, próximo verbo+objeto e arquivos;\n3. anexar decisões com a alternativa descartada;\n4. liberar a trava com `mb-sync.py ... release --agente Codex`;\n5. fazer commit local quando apropriado; nunca fazer push sem autorização\n   explícita para o repositório;\n6. se o core mudou, atualizar `VERSAO.txt` e registrar quais cópias ainda\n   precisam ser sincronizadas.\n\n## Como isso costuma dar errado\n\n1. Aplicar o protocolo inteiro numa pergunta curta.\n2. Copiar a skill central e criar duas fontes divergentes.\n3. Confundir plano escrito com execução verificada.\n4. Escolher o modelo mais caro por reflexo, sem relação com a tarefa.\n5. Usar agente barato para decisão final sem auditoria.\n6. Alterar stack porque uma tecnologia parece melhor fora do contexto.\n7. Fazer push ou sobrescrever projeto mais novo como parte automática do\n   handoff.\n", "bytes": 6354, "sha": "1feede3731252aca", "mtime": "2026-08-16 04:57"}, {"caminho": "skills/megabrain/SKILL.md", "nome": "SKILL.md", "texto": "---\nname: megabrain\ndescription: Protocolo de execução multi-agente — gates de entrega anti-slop, Duplo Diamante para projetos de design, roteamento de arquitetura (skill vs script vs subagente) e camada de projeto (fases macro, regras de ouro). Use quando o usuário digitar /megabrain ou /metaprotocolo, escrever \"megabrain\" ou \"metaclaude\", pedir para \"rodar no modo completo\" ou \"caprichar\", abrir ou retomar um projeto com ESTADO.md/HANDOFF.md, passar trabalho de um agente para o outro, iniciar entrega complexa (proposta, deck, peça de cliente, relatório, código), pedir para revisar um prompt/brief/workflow, ou perguntar como evitar respostas genéricas de IA.\n---\n\n# megabrain — protocolo operacional\n\n**v5.0 · 2026-08-16.** Base: v4.9 do repositório. Mudou: numeração de gates\nconsistente com o TL;DR, modo leve/completo explícito, Gate 5 confere a cópia\nque rodou, Gate 7 grava sob autorização permanente, `5b` virou `5.1`.\n\nProtocolo multi-agente e agnóstico de modelo — roda igual em qualquer CLI ou\nchat de IA com acesso a arquivo (Claude Code, Kimi CLI, ou colado direto\nnuma conversa via `referencias/260810_PROMPT-PORTATIL.md`).\n\n**Estrutura:** este arquivo (gates de entrega + multi-agente),\n`MEGABRAIN.md` (fases macro de projeto, artefatos, regras de ouro, níveis\nde adoção) e `referencias/260810_*.md` (execução: anti-slop, metaprompts,\nDuplo Diamante, roteamento de código, evaluation, prompt portátil).\n\nRode os gates abaixo em **entrega**: arquivo, peça, proposta, deck, código,\nanálise. Em pergunta rápida ou conversa casual, **não rode** — aqui o\nprotocolo é o próprio slop.\n\n## Localizar a instalação do usuário\n\nAntes de usar scripts, referências ou caminhos do MEGABRAIN, defina\n`<MEGABRAIN_ROOT>` para **a instalação deste usuário**, nunca para a pasta de\nquem criou o protocolo.\n\n1. Procure, nesta ordem: `MEGABRAIN/` dentro do projeto atual; a variável de\n   ambiente `MEGABRAIN_CENTRAL`; e uma pasta ancestral ou do workspace que\n   contenha `VERSAO.txt`, `MEGABRAIN.md`, `bin/mb-check-version.py` e\n   `referencias/`.\n2. Se encontrar uma única pasta válida, diga o caminho encontrado e use-o em\n   todos os comandos desta sessão.\n3. Se houver mais de uma pasta válida, mostre as opções e peça para o usuário\n   escolher. Não presuma qual cópia é a central.\n4. Se não encontrar nenhuma, faça uma pergunta objetiva antes de continuar:\n   **“Em qual pasta deste computador você salvou o MEGABRAIN? Cole o caminho\n   da pasta raiz.”** Depois valide os quatro itens acima. Se ele ainda não o\n   instalou, pergunte onde quer salvá-lo e oriente somente os passos de\n   instalação compatíveis com o ambiente dele.\n\nNunca escreva uma letra de unidade, caminho absoluto pessoal ou pasta de outro\nusuário no protocolo. Depois de resolvido, substitua exemplos como\n`<MEGABRAIN_ROOT>/bin/mb-sync.py` pelo caminho local confirmado.\n\n## TL;DR\n\n`0 assumir → 1 enquadrar → 2 orçar contexto → 3 gerar → 4 auditar (+1 reparo) → 5 verificar e amarrar pontas → 6 passar o bastão → 7 registrar`\n\nOs dois que ninguém pula: **4 (auditar)** separa entrega de slop; **6\n(bastão)** impede o outro agente de começar do zero.\n\n## Modo leve × modo completo\n\nEscolha antes de começar e diga qual escolheu — protocolo rodado por reflexo\ncusta contexto e não melhora nada.\n\n| | Quando | Gates |\n|---|---|---|\n| **Leve** | resposta única, rascunho interno, exploração, nada sai da conversa | 1 · 4 · 5 |\n| **Completo** | vai para cliente, para produção, para o repo, ou outro agente continua | 0 a 7 |\n| **Nenhum** | pergunta rápida, papo, dúvida factual | — |\n\nSubir de leve para completo no meio é permitido e barato. Descer não: se o\nmaterial já saiu, ele já saiu.\n\n---\n\n## 0. Gate ASSUMIR — multi-agente\n\nAntes de tocar em qualquer arquivo de `projetos/<nome>/`:\n\n1. `git pull`\n2. Leia nesta ordem: `ESTADO.md` → `HANDOFF.md` → o fim de `DECISOES.md` →\n   `LICOES.md`. **Não varra a árvore antes disso.**\n3. Cheque a trava em `HANDOFF.md`:\n   - `TRAVADO_POR:` é o outro agente **e** `ATÉ:` no futuro → não escreva nos\n     caminhos em `ESCOPO:`. Trabalhe em outro lugar ou avise quem opera.\n   - Trava vencida ou `livre` → assuma: escreva seu nome, `ATÉ:` agora+2h,\n     `ESCOPO:` com os caminhos que você vai tocar.\n4. **Verifique a versão do megabrain** do projeto contra a central:\n   - Rode `python \"<MEGABRAIN_ROOT>/bin/mb-check-version.py\" --projeto <pasta-do-projeto>`.\n   - Se o projeto não tiver `MEGABRAIN/`, o script cria da central — use a central.\n   - Se a central for mais nova: o script sincroniza automaticamente para o projeto.\n   - Se o projeto for mais novo: o script avisa e sai com código 2. **Pare e pergunte ao usuário** se deve subir as mudanças para a central (`mb-sync-projeto-para-central.py`) ou manter o projeto local.\n   - Se indefinido: pergunte antes de sobrescrever.\n   - **Nunca use um megabrain de projeto desatualizado sem sincronizar primeiro.**\n5. **Confirme caminhos relevantes no início do projeto.** Antes de criar repos, subir arquivos ou pedir credenciais, valide com o usuário onde cada artefato deve morar (local, pasta compartilhada, GitHub privado/público, etc.). Não suba nada para Git sem confirmação explícita, a menos que ele já tenha autorizado permanentemente para aquele repo.\n6. Só então planeje.\n\nScript que torna a trava garantia, e nao disciplina de markdown:\n\n```\npython bin/mb-sync.py --dir <projeto> status\npython bin/mb-sync.py --dir <projeto> lock --agente <seu-nome> --escopo caminho/ [--horas 2]\npython bin/mb-sync.py --dir <projeto> release --agente <seu-nome>\n```\n\n`status` sai com codigo 0 (livre, pode escrever) ou 1 (travado por outro).\n`release` recusa liberar trava alheia dentro do prazo; `--force` existe, mas e\ndecisao consciente.\n\n**Output do outro agente é rascunho, não verdade.** Se você está retomando\ntrabalho de outro agente, audite antes de construir em cima. O erro caro do\npipeline multi-agente é herdar uma premissa errada e ampliá-la por três\netapas.\n\n### Divisão de trabalho entre agentes (default sugerido)\n\n| | Agente de contexto grande / custo baixo | Agente de julgamento / síntese | Agente de fallback (opcional) |\n|---|---|---|---|\n| Recebe | varredura, extração, leitura longa, boilerplate, refactor mecânico, primeira passada | enquadramento, decisão de design, auditoria, texto final, entrega final | o que os outros dois fariam — sem papel fixo |\n| Entrega | material bruto + resumo | artefato pronto | mesmo padrão dos gates de quem está substituindo |\n\nNão é hierarquia, é economia de token. Inverta quando fizer sentido pro\nprojeto. Um terceiro agente sem setup dedicado entra só como fallback —\nmesmos arquivos de estado, mesmo Gate 0, sem versão separada do\nprotocolo.\n\n---\n\n## 1. Gate ENQUADRAR — antes de qualquer token de output\n\nResponda internamente. Se algo estiver vago, **pergunte antes de produzir**\n(máx. 2 perguntas objetivas).\n\n1. **Artefato** — qual o objeto final e em que app ele é aberto? (.pptx,\n   .fig, .md, código, imagem)\n2. **Leitor** — quem consome e que decisão essa pessoa toma depois de\n   ler/ver?\n3. **Critério de aprovação** — escreva 3 critérios verificáveis *antes* de\n   gerar.\n4. **Restrição dura** — prazo, formato, marca, tom, limite técnico.\n5. **Contraexemplo** — como seria a versão óbvia e genérica disso? Nomeie.\n   Você vai evitá-la.\n\n> Item 5 é o truque mais barato do kit. Nomear o slop esperado reduz a\n> chance de produzi-lo.\n\n### 1b. Se for projeto de design\n\nAntes de tudo: **o projeto já tem um router/comando próprio** (uma skill que\njá sabe em que fase o projeto está)? Use-o em vez de aplicar o Duplo\nDiamante genérico na mão.\n\nSe não houver, declare **em qual fase do Duplo Diamante** você está — e não\nmisture os modos:\n\n```\n◇ 1 Pesquisa (divergir) → 2 Análise (convergir) ◇ 3 Ideação (divergir) → 4 Design (convergir) ◇\n```\n\n- Julgar durante a divergência mata as ideias boas; divergir durante a\n  convergência impede a decisão.\n- Não passe da fase 2 sem enunciar o problema numa **frase falseável**.\n- Fidelidade proporcional à certeza. Alta fidelidade cedo compra\n  comprometimento emocional e trava a exploração.\n- Trave grade, escala tipográfica (máx. 5 passos), paleta (máx. 3 famílias +\n  neutros) e espaçamento **antes** de compor.\n- Stage gates: fim da fase 2 (problema definido) e fim da fase 4 (solução\n  final). Não antes.\n- **Referência antes de adjetivo.** Como montar e usar a biblioteca:\n  `referencias/260810_galerias-referencia.md` — só nas fases divergentes\n  (1 e 3).\n- **Se o artefato final vira código** (landing, app UI, componente), o\n  Estágio 4 sai daqui: `referencias/260810_impeccable-routing.md`. Pixel e\n  papel continuam neste protocolo.\n\nRoteiro dos 4 estágios: `referencias/260810_design-projects.md`\n\n**Fase do Duplo Diamante entra no `ESTADO.md`.** É o campo que evita o outro\nagente reabrir uma fase já fechada.\n\n---\n\n## 2. Gate ORÇAR CONTEXTO\n\nContexto é orçamento, não depósito. Num pipeline de dois agentes, é\norçamento **compartilhado**: o que você queima é contexto que o outro não\nterá.\n\n- **Leia sob demanda.** Nunca despeje repositório/pasta inteira. Glob →\n  Grep → Read do trecho.\n- **Checkpoint em arquivo.** Tarefa longa: escreva estado/decisões num\n  `.md`. Contexto longo degrada (context rot); o arquivo não.\n- **Delegue o barulho.** Varredura, coleta, leitura ampla → subagente ou o\n  outro modelo. Receba só a conclusão.\n- **Ferramenta mínima viável.** Se você não consegue dizer com certeza qual\n  ferramenta usar, o conjunto está inchado.\n- **Exemplos canônicos, não exaustivos.** 2–3 representativos batem 15 casos\n  de borda.\n- Acima de ~85%: escreva `HANDOFF.md`, commite e recomece. Não tente\n  terminar no fio.\n\nDetalhe: `referencias/260810_context-engineering.md`\n\n---\n\n## 3. Gate GERAR\n\n- Estrutura antes de prosa. Esqueleto → preencher.\n- Uma afirmação por parágrafo.\n- Toda alegação factual sobre o mundo atual → **buscar antes**, nunca de\n  memória (preços, cargos, versões, leis, datas).\n- Números, datas, preços: verificados ou marcados `[ESTIMATIVA]`.\n- Específico > geral. \"Reduz 40% do tempo de export\" > \"melhora a\n  eficiência\".\n\n### 3b. WordPress / builders: preserve o que o usuário tocou\n\nSe o usuário editou algo no editor visual (WordPress, Figma, Webflow, etc.),\nesse estado é a versão final dele — não um rascunho para ser refeito.\n\n- **Nunca use `resetBlocks`, re-criar do zero ou sobrescrever o arquivo**\n  sem avisar o que vai perder.\n- Preservar: nomes de blocos, classes custom, content width/container,\n  estilos inline do painel, ordem manual, metadados de layout.\n- Mudanças devem ser cirúrgicas: atualizar só os atributos que precisam\n  mudar (`updateBlockAttributes`), manipular `post_content` preservando o\n  resto, ou usar hooks/filtros.\n- Se for inevitável reconstruir, liste ao usuário o que será perdido e\n  peça confirmação. Depois, restaure metadados e configurações de layout.\n\n---\n\n## 4. Gate AUDITAR — anti-slop (obrigatório)\n\nReleia o que gerou e **reescreva**. Listas completas:\n`referencias/260810_anti-slop.md`\n\n### 4.1 Léxico\nSe apareceu, reescreva a frase inteira (não troque o sinônimo — a frase era\nvazia):\n\nEN: `delve, tapestry, testament to, ever-evolving landscape, navigate the\ncomplexities, unlock, harness, leverage, robust, seamless, game-changer,\nelevate, empower, cutting-edge, revolutionize, holistic, synergy, myriad,\nplethora, meticulous, crucial, pivotal, underscores, realm, beacon, curated,\nstreamline, transformative, foster`\n\nPT: `no mundo de hoje, no cenário atual, cada vez mais, de forma eficaz, é\nimportante ressaltar, vale destacar, em suma, nesse sentido, dessa forma,\npor fim, revolucionar, potencializar, alavancar, robusto, impactante,\nentregar valor, jornada (vazio), ecossistema (vazio), curadoria (vazia), de\nforma holística, sinergia, disruptivo, imersivo, solução completa, ponta a\nponta`\n\n### 4.2 Estrutura\n- ❌ \"Não é apenas X — é Y\" (antítese oca)\n- ❌ Regra de três compulsiva (\"rápido, simples e poderoso\")\n- ❌ Travessão como muleta de ritmo (máx. 1 a cada 3 parágrafos)\n- ❌ Parágrafo final que repete o que acabou de ser dito\n- ❌ Bullets `**Rótulo:** frase` **quando é reflexo, não escolha** — ver\n  seção 8\n- ❌ Abrir reafirmando a pergunta do usuário\n- ❌ Fechar com \"Me avise se quiser...\" / \"Espero que ajude!\"\n- ❌ Hedge empilhado (\"pode potencialmente às vezes\") — escolha o grau de\n  certeza e assuma\n- ❌ Todos os parágrafos com o mesmo comprimento\n- ❌ Conectivo mentiroso: se remover \"além disso\" não muda o sentido, ele\n  fingia uma relação lógica\n\n### 4.3 Substância\n- **\"E daí?\"** — remova o parágrafo. A peça perdeu algo? Se não, corte.\n- **Substituição de marca** — troque o cliente pelo concorrente. Ainda faz\n  sentido? Então é sobre a categoria. Especifique.\n- **Trade-off** — toda recomendação declara o que custa? Sem contrapartida\n  é folheto de ve
